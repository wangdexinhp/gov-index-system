<!-- 查询条件区 -->
<section class="card p-6">
<div class="grid grid-cols-6 gap-6 items-end">
  <div class="space-y-2">

    <select class="max-w-xs border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" id="indicatorGroupSelect">

      <option value="employment">就业数据</option>

      <option value="social_security">社会保障数据</option>
      <option value="healthcare">医疗卫生数据</option>
      <option value="infrastructure">基础设施数据</option>
      <option value="public_safety">公共安全数据</option>

      <option value="economic_growth">经济增长数据</option>
      <option value="economic_development">经济发展数据</option>
      <option value="public_service">公共服务数据</option>
      <option value="law_based_governance">依法行政数据</option>
      <option value="government_affairs_openness">政务公开数据</option>
    </select>
  </div>
  <div class="space-y-2">
    <label class="block text-sm font-medium text-gray-700">请选择指标</label>
    <select class="max-w-xs border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" id="indicatorSelect">
      <option value="">请先选择分组</option>
    </select>
  </div>
<div class="space-y-2">
<label class="block text-sm font-medium text-gray-700">请选择省份</label>
<select class="max-w-xs border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" id="provinceSelect" onchange="updateCities()">
<option value="">请选择省份</option>

<option value="江苏省">江苏省</option>
<option value="浙江省">浙江省</option>

</div>
<div class="space-y-2">

<option value="">请先选择省份</option>
</select>
</div>

<option value="2024">2024年</option>

</div>
</div>

<!-- 数据展示区 -->
<div class="hidden space-y-6" id="resultContent">
<!-- 表格卡片 -->
<section class="card p-6">
<div class="flex justify-between items-center mb-4">
<h2 class="text-lg font-bold text-gray-800 border-l-4 border-blue-600 pl-3" id="tableTitle">历年数据明细</h2>
<div class="flex items-center space-x-2">
<span class="text-sm text-gray-500">数值排序：</span>
<select class="border border-gray-300 rounded px-2 py-1 text-sm outline-none" id="sortOrder" onchange="renderTable()">
<option value="year_asc">按年份升序</option>
<option value="val_asc">按数值升序</option>
<option value="val_desc">按数值降序</option>
</select>
</div>
</div>
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead>
<tr class="bg-gray-50 border-b border-gray-200">
<th class="px-6 py-4 font-semibold text-gray-700">年份</th>
<th class="px-6 py-4 font-semibold text-gray-700" id="indicatorHeader">指标值</th>
<th class="px-6 py-4 font-semibold text-gray-700">单位</th>
<th class="px-6 py-4 font-semibold text-gray-700">操作</th>
</tr>
</thead>
<tbody class="divide-y divide-gray-100" id="tableBody">
<!-- JS 填充 -->
</tbody>
</table>
</div>
</section>
<!-- 图表卡片 -->
<section class="card p-6">
<div class="flex justify-between items-center mb-6">
<h2 class="text-lg font-bold text-gray-800 border-l-4 border-blue-600 pl-3" id="chartTitle">趋势分析视图</h2>
<div class="flex bg-gray-100 p-1 rounded-lg">
<button class="px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white text-blue-600 shadow-sm" id="btnBar" onclick="switchChart('bar')">柱状图</button>
<button class="px-4 py-1.5 rounded-md text-sm font-medium transition-all text-gray-600 hover:text-blue-600" id="btnLine" onclick="switchChart('line')">曲线图</button>
</div>
</div>
<div class="w-full h-[400px]" id="mainChart"></div>
</section>
</div>
<!-- 缺省页 -->
<div class="card py-20 flex flex-col items-center justify-center text-gray-400" id="emptyState">
<img alt="No data illustration" class="w-32 h-32 mb-4 opacity-20" id="1" src="https://modao.cc/agent-py/media/generated_images/2025-12-19/cfa70c9f5ea744609279fdbeadddb0f3.jpg"/>
<p>请选择指标和地区后点击查询按钮</p>
</div>
</div>
<script>
    const cityData = {
      "广东省": ["广州市", "深圳市", "珠海市", "佛山市"],
      "江苏省": ["南京市", "无锡市", "徐州市", "苏州市"],
      "浙江省": ["杭州市", "宁波市", "温州市", "嘉兴市"]
    };

    // 指标分组与指标列表，参考 home.html indicatorCategories
    const indicatorCategories = {
      'admin': ['市数量', '区数量', '县数量', '辖区面积'],
      'population': ['常住人口数', '城镇人口数', '乡村人口数', '户籍人口数', '年末总人口', '年末总户数', '15-19岁人口数', '60岁以上人口数', '出生人口性别比', '人口出生率'],
      'economy_structure': ['年末个体工商户数量', '年末内资企业数', '年末外资企业数', '年末私营企业数', '高新技术企业产值', '高新技术企业增加值', '技术合同成交额（交易额）', '技术合同成交额（交易额）增长率', '国有资产保值增值率', '第二产业增加值占GDP（增量）比重', '第三产业增加值占GDP（增量）比重'],
      'education_tech': ['有效发明专利量（发明专利有效量）', '每万人发明专利拥有量', '专利授权数量', '普通小学专任教师数', '普通中学专任教师数', '普通小学在校学生数', '普通中学在校学生数', '高中学在校学生数', 'R&D经费'],
      'employment': ['采矿（掘)业就业人员人数', '制造业就业人员人数', '采矿（掘)业在岗职工人数', '制造业在岗职工人数', '城镇单位职工工资总额', '城镇就业人数（城镇单位职工总数（城镇单位就业人数+城镇私营就业人数））', '社会从业人员', '机关单位工资总额', '机关单位就业人数', '公共管理、社会保障和社会组织工资总额', '公共管理、社会保障和社会组织在岗职工人数'],
      'finance': ['一般公共预算支出', '一般公共服务支出', '科学技术支出', '公共安全支出', '文化体育传媒支出', '环保支出', '社会保障和就业支出', '教育支出', '医疗卫生支出'],
      'economic_performance': ['城镇居民人均消费支出', '城镇食品支出', '农村居民人均消费支出', '农村食品支出', '城镇恩格尔系数', '农村恩格尔系数', '城镇登记失业人员数', '城镇登记失业率', '能源消耗总量', '万元GDP综合能源消耗', '城镇化率', '城镇居民人均可支配收入', '城镇居民人均可支配收入增长率', '农民居民人均可支配收入', '农民居民人均可支配收入增长率'],
      'ecology': ['园林绿地面积', '二氧化硫排放总量', '工业二氧化硫排放量', '森林覆盖率', '水土流失治理面积', '工业废水排放总量', '工业固体废弃物综合利用率', '生活垃圾无害化处理率', '城镇生活污水处理率', '城市空气质量指数', '城市区域环境噪音指数', 'PM2.5', 'PM10'],
      'market_supervision': ['查出不正当竞争案件数', '生产安全事故死亡人数', '工矿商贸死亡人数', '亿元GDP生产安全事故死亡率', '十万人工矿商贸从业人员事故死亡率', '食品质量抽样检测合格率', '药品安全抽样合格率', '工业产品质量抽样合格率', '查处农资违法案件的数量', '查办违法广告的件数', '查办商标侵权案件的件数', '受理消费者维权案件数', '受理消费者投诉案件数', '消费者维权案件办理率'],
      'social_security': ['城镇职工基本养老保险人数', '城乡居民基本养老保险人数', '城镇职工基本医疗保险人数', '城乡居民基本医疗保险人数', '城镇最低生活保障人数', '农村最低生活保障人数', '年末实有社会组织登记数量', '养老机构床位数', '城镇新增就业人数', '新建保障性住房套数'],
      'healthcare': ['卫生技术人员数量', '医疗机构病床数'],
      'infrastructure': ['有线电视用户数', '固定宽带互联网用户数', '自来水受益村数', '村委会个数'],
      'public_safety': ['刑事案件立案件数', '刑事案件破案件数', '受理信访举报案件数', '调处各类矛盾纠纷件数', '成功调处各类矛盾纠纷数', '受理各类法律援助案件的数量', '火灾死亡人数', '接待群众来信来访人次'],
      'culture_sports': ['文化馆、群众艺术馆', '博物馆', '艺术表演团体', '体育场馆', '公共图书馆'],
      'administrative_integrity': ['贪污贿赂人数', '渎职侵权人数', '立案查处违法违纪案件数', '被依法追究责任的领导干部人数'],
      'economic_growth': ['GDP', '人均GDP', 'GDP增长率', '一般公共预算收入', '财政总收入', '财政总收入增长率', '固定资产投资总额', '固定资产投资总额增长率', '全社会消费品零售总额', '全社会消费品零售总额增长率', '进出口总额', '进出口总额增长率', '实际利用外资金额', '实际利用外资金额增长率', '规模以上工业企业增加值'],
      'economic_development': ['居民消费价格指数CPI', '工业品出厂价格指数PPI'],
      'public_service': ['人均城市道路面积', '高中阶段毛入学率'],
      'law_based_governance': ['行政复议案件办结率', '行政复议案件申请量', '行政案件数'],
      'government_affairs_openness': ['主动公开政府信息件数','主动公开政府信息件数备注', '依申请公开政府信息件数', '依申请公开政府信息件数备注','因公开问题申请行政复议的数量','因公开问题申请行政复议的数量备注']
    };

    let rawData = [];
    let currentChartType = 'bar';
    let myChart = null;

    // 分组选择后，动态填充指标下拉框
    document.addEventListener('DOMContentLoaded', function() {
      const groupSelect = document.getElementById('indicatorGroupSelect');
      const indicatorSelect = document.getElementById('indicatorSelect');
      if (groupSelect && indicatorSelect) {
        groupSelect.addEventListener('change', function() {
          const group = this.value;
          indicatorSelect.innerHTML = '<option value="">请选择指标</option>';
          if (group && indicatorCategories[group]) {
            indicatorCategories[group].forEach(ind => {
              const opt = document.createElement('option');
              opt.value = ind;
              opt.textContent = ind;
              indicatorSelect.appendChild(opt);
            });
          }
        });
      }
    });

    function updateCities() {
      const province = document.getElementById('provinceSelect').value;
      const citySelect = document.getElementById('citySelect');
      citySelect.innerHTML = '<option value="">选择城市</option>';
      if (cityData[province]) {
        cityData[province].forEach(city => {
          const opt = document.createElement('option');
          opt.value = city;
          opt.textContent = city;
          citySelect.appendChild(opt);
        });
      }
    }

    function handleSearch() {
      const indicator = document.getElementById('indicatorSelect').value;
      const group = document.getElementById('indicatorGroupSelect').value;
      const city = document.getElementById('citySelect').value;
      const province = document.getElementById('provinceSelect').value;
      const startYear = document.getElementById('startYear').value;
      const endYear = document.getElementById('endYear').value;

      if (!indicator || !group || !city || !province) {
        alert("请完整选择分组、指标、省份和城市");
        return;
      }
      if (parseInt(startYear) > parseInt(endYear)) {
        alert("起始年份不能大于终止年份");
        return;
      }

      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('resultContent').classList.remove('hidden');

      // 发起 AJAX 请求到后端接口
      fetch(`/dashboard/single_indicator_query/?name_zh=${encodeURIComponent(indicator)}&start_year=${startYear}&end_year=${endYear}&city=${encodeURIComponent(city)}&province=${encodeURIComponent(province)}`)
        .then(res => res.json())
        .then(res => {
          if (!res.success || !res.data || res.data.length === 0) {
            document.getElementById('tableBody').innerHTML = '';
            if (myChart) myChart.clear();
            alert('没有查询到数据');
            return;
          }
          rawData = res.data.map(item => ({
            year: item.year + '年',
            val: item.value,
            unit: indicator.includes('人口') ? '万人' : (indicator.includes('面积') ? '平方公里' : '项')
          }));

          document.getElementById('tableTitle').textContent = `${city} - ${indicator} 历年数据`;
          document.getElementById('chartTitle').textContent = `${city} - ${indicator} 变化趋势`;
          document.getElementById('indicatorHeader').textContent = indicator;

          renderTable();
          renderChart();
        })
        .catch(err => {
          alert('查询失败: ' + err);
        });
    }

    function renderTable() {
      const sort = document.getElementById('sortOrder').value;
      let displayData = [...rawData];

      if (sort === 'val_asc') displayData.sort((a, b) => a.val - b.val);
      else if (sort === 'val_desc') displayData.sort((a, b) => b.val - a.val);
      else displayData.sort((a, b) => parseInt(a.year) - parseInt(b.year));

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      displayData.forEach((item, idx) => {
        const tr = document.createElement('tr');
        tr.className = (idx % 2 === 0 ? 'bg-white' : 'bg-gray-50/50') + ' table-detail-row';
        tr.innerHTML = `
          <td class="px-6 py-4 text-gray-800 font-medium border-b border-gray-100">${item.year}</td>
          <td class="px-6 py-4 indicator-value border-b border-gray-100">${item.val.toLocaleString()}</td>
          <td class="px-6 py-4 text-gray-500 border-b border-gray-100">${item.unit}</td>
          <td class="px-6 py-4">
            <button class="text-blue-600 hover:text-blue-800 text-sm">详情</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderChart() {
      if (!myChart) myChart = echarts.init(document.getElementById('mainChart'));
      
      const years = rawData.map(d => d.year);
      const vals = rawData.map(d => d.val);
      
      const option = {
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        grid: { top: '10%', left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: { type: 'category', data: years, axisTick: { alignWithLabel: true } },
        yAxis: { type: 'value', splitLine: { lineStyle: { type: 'dashed' } } },
        series: [{
          data: vals,
          type: currentChartType,
          smooth: true,
          barWidth: '35%',
          symbol: 'circle',
          symbolSize: 8,
          lineStyle: { width: 3, color: '#3b82f6' },
          itemStyle: {
            color: currentChartType === 'bar' 
              ? new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                  { offset: 0, color: '#3b82f6' },
                  { offset: 1, color: '#60a5fa' }
                ])
              : '#2563eb',
            borderRadius: [4, 4, 0, 0]
          },
          areaStyle: currentChartType === 'line' ? {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: 'rgba(24,144,255,0.3)' },
              { offset: 1, color: 'rgba(24,144,255,0)' }
            ])
          } : null
        }]
      };
      myChart.setOption(option);
      window.addEventListener('resize', () => myChart.resize());
    }

    function switchChart(type) {
      currentChartType = type;
      const btnBar = document.getElementById('btnBar');
      const btnLine = document.getElementById('btnLine');
      
      if (type === 'bar') {
        btnBar.className = 'px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white text-blue-600 shadow-sm';
        btnLine.className = 'px-4 py-1.5 rounded-md text-sm font-medium transition-all text-gray-600 hover:text-blue-600';
      } else {
        btnLine.className = 'px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white text-blue-600 shadow-sm';
        btnBar.className = 'px-4 py-1.5 rounded-md text-sm font-medium transition-all text-gray-600 hover:text-blue-600';
      }
      renderChart();
    }
  </script>
</body>
</html>
