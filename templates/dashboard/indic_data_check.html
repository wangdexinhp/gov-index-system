<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>城策智库 · 指标校验</title>
<script src="/static/js/tailwindcss.js"></script>
<script src="/static/js/indicator_catalog.js"></script>
<script src="/static/js/iconify.min.js"></script>
<script src="/static/js/iconify-icon.min.js"></script>
<style>

    :root {
        --drc-blue: #1a5fb4;
        --drc-blue-dark: #144a8c;
        --drc-blue-light: #e8f1fb;
        --drc-border: #c5d0dc;
        --drc-bg: #eef2f6;
        --drc-toolbar: #f7f9fc;
        --drc-text: #333;
        --drc-muted: #666;
    }
    body {
        background: var(--drc-bg);
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        font-size: 12px;
        color: var(--drc-text);
        margin: 0;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 顶栏 */
    .drc-header {
        background: linear-gradient(180deg, #1f6fc2 0%, var(--drc-blue) 100%);
        color: #fff;
        height: 48px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        box-shadow: 0 1px 3px rgba(0,0,0,.15);
        position: sticky;
        top: 0;
        z-index: 100;
    }
    .drc-header .logo-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: .5px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .drc-header .nav-links {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .drc-header .nav-links a {
        color: rgba(255,255,255,.9);
        text-decoration: none;
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 2px;
    }
    .drc-header .nav-links a:hover,
    .drc-header .nav-links a.active {
        background: rgba(255,255,255,.15);
        color: #fff;
    }

    /* 工具条 */
    .drc-toolbar {
        background: var(--drc-toolbar);
        border-bottom: 1px solid var(--drc-border);
        padding: 6px 12px;
    }
    .drc-toolbar-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
    }
    .drc-toolbar-row + .drc-toolbar-row { margin-top: 6px; }
    .drc-tab {
        padding: 5px 14px;
        border: 1px solid var(--drc-border);
        background: #fff;
        color: var(--drc-text);
        font-size: 12px;
        cursor: pointer;
        border-radius: 2px;
    }
    .drc-tab.active {
        background: var(--drc-blue);
        border-color: var(--drc-blue);
        color: #fff;
    }
    .drc-tab-link {
        padding: 5px 12px;
        border: 1px solid transparent;
        color: var(--drc-muted);
        text-decoration: none;
        font-size: 12px;
        border-radius: 2px;
    }
    .drc-tab-link.active {
        background: #fff;
        border-color: var(--drc-border);
        color: var(--drc-blue);
        font-weight: 600;
    }
    .drc-btn {
        padding: 4px 12px;
        border: 1px solid var(--drc-border);
        background: #fff;
        color: var(--drc-text);
        font-size: 12px;
        cursor: pointer;
        border-radius: 2px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }
    .drc-btn:hover { background: var(--drc-blue-light); border-color: #9bb8d9; }
    .drc-btn-primary {
        background: var(--drc-blue);
        border-color: var(--drc-blue);
        color: #fff;
    }
    .drc-btn-primary:hover { background: var(--drc-blue-dark); }
    .drc-field {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
    }
    .drc-field label { color: var(--drc-muted); white-space: nowrap; }
    .drc-field select {
        border: 1px solid var(--drc-border);
        padding: 3px 8px;
        font-size: 12px;
        background: #fff;
        border-radius: 2px;
        min-width: 100px;
    }
    .drc-progress {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--drc-muted);
    }
    .drc-progress-bar {
        width: 120px;
        height: 6px;
        background: #dde4ec;
        border-radius: 3px;
        overflow: hidden;
    }
    .drc-progress-bar > div {
        height: 100%;
        background: var(--drc-blue);
        transition: width .3s;
    }

    /* 工作区 */
    .drc-workspace {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 120px);
        min-height: 500px;
    }
    .drc-filter-bar-top {
        padding: 8px 12px;
        background: #fafbfc;
        border-bottom: 1px solid var(--drc-border);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }
    .drc-filter-bar-top .drc-field select {
        border: 1px solid var(--drc-border);
        padding: 4px 8px;
        font-size: 12px;
        border-radius: 2px;
        min-width: 110px;
    }
    .drc-modal-pane-body .drc-tree {
        border: none;
        height: 100%;
        max-height: none;
    }
    .drc-filter-summary {
        font-size: 12px;
        color: var(--drc-muted);
        margin-left: 8px;
    }
    .drc-filter-summary strong { color: var(--drc-blue-dark); font-weight: 600; }

    /* 弹窗 */
    .drc-modal-mask {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.35);
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .drc-modal-mask.hidden { display: none; }
    .drc-modal {
        background: #fff;
        border: 1px solid var(--drc-border);
        border-radius: 4px;
        box-shadow: 0 8px 32px rgba(0,0,0,.18);
        width: min(920px, 94vw);
        max-height: 88vh;
        display: flex;
        flex-direction: column;
    }
    .drc-modal-header {
        padding: 10px 16px;
        background: var(--drc-blue-light);
        border-bottom: 1px solid var(--drc-border);
        font-weight: 600;
        font-size: 13px;
        color: var(--drc-blue-dark);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .drc-modal-close {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 18px;
        color: #666;
        line-height: 1;
        padding: 0 4px;
    }
    .drc-modal-body {
        display: flex;
        flex: 1;
        min-height: 0;
        height: 480px;
    }
    .drc-modal-pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        border-right: 1px solid var(--drc-border);
    }
    .drc-modal-pane:last-child { border-right: none; }
    .drc-modal-pane-title {
        padding: 8px 12px;
        background: #f5f8fb;
        border-bottom: 1px solid var(--drc-border);
        font-size: 12px;
        font-weight: 600;
        color: #444;
    }
    .drc-modal-pane-body {
        flex: 1;
        overflow-y: auto;
        padding: 10px 12px;
    }
    .drc-modal-footer {
        padding: 10px 16px;
        border-top: 1px solid var(--drc-border);
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        background: #fafbfc;
    }
    .drc-selected-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 24px;
    }
    .drc-selected-tag {
        background: #dce9f8;
        color: var(--drc-blue-dark);
        padding: 3px 8px;
        border-radius: 2px;
        font-size: 11px;
        border: 1px solid #b8d0ea;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }
    .drc-selected-tag button {
        border: none;
        background: none;
        cursor: pointer;
        color: #888;
        font-size: 14px;
        line-height: 1;
        padding: 0;
    }
    .drc-modal-pane-body select {
        width: 100%;
        border: 1px solid var(--drc-border);
        padding: 4px 8px;
        font-size: 12px;
        margin-bottom: 8px;
        border-radius: 2px;
    }
    .drc-tree {
        overflow-y: auto;
        border: 1px solid var(--drc-border);
        border-radius: 2px;
    }
    .drc-tree-item {
        padding: 7px 12px;
        cursor: pointer;
        font-size: 12px;
        border-left: 3px solid transparent;
        color: var(--drc-text);
    }
    .drc-tree-item:hover { background: #f0f6fc; }
    .drc-tree-item.active {
        background: #dce9f8;
        border-left-color: var(--drc-blue);
        color: var(--drc-blue-dark);
        font-weight: 600;
    }
    #city-items, #indicator-content {
        max-height: none;
        overflow: visible;
        padding: 0;
    }
    #indicator-content { font-size: 12px; }
    .city-row, .indicator-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 2px;
        font-size: 12px;
    }
    .city-row label, .indicator-row label { cursor: pointer; flex: 1; }
    .city-checkbox, .indicator-checkbox {
        width: 14px; height: 14px; cursor: pointer; accent-color: var(--drc-blue);
    }

    #indicator-filter { display: none; }

    .drc-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: #fff;
        min-height: 0;
    }

    .drc-content-tabs {
        display: flex;
        border-bottom: 1px solid var(--drc-border);
        padding: 0 12px;
        background: #fafbfc;
    }
    .drc-content-tabs button {
        padding: 8px 16px;
        border: none;
        background: none;
        font-size: 12px;
        color: var(--drc-muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
    }
    .drc-content-tabs button.active {
        color: var(--drc-blue);
        border-bottom-color: var(--drc-blue);
        font-weight: 600;
    }

    .drc-table-area {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 0;
    }
    .table-wrapper {
        flex: 1;
        overflow: auto;
        border: none;
    }
    .data-table {
        min-width: 800px;
        width: max-content;
        border-collapse: collapse;
        font-size: 12px;
    }
    .data-table th, .data-table td {
        border: 1px solid var(--drc-border);
        padding: 4px 8px;
        vertical-align: middle;
    }
    .data-table thead th {
        background: #e8eef5;
        color: #333;
        font-weight: 600;
        white-space: nowrap;
    }
    .data-table thead tr:nth-child(2) th {
        background: #f3f6fa;
        font-weight: 500;
        font-size: 11px;
    }
    .data-table th:first-child,
    .data-table td:first-child {
        position: sticky;
        left: 0;
        background: #f8fafc;
        z-index: 2;
        box-shadow: 2px 0 4px rgba(0,0,0,.06);
    }
    .data-table thead th:first-child { z-index: 3; background: #e8eef5; }
    .data-table th[data-indicator] { min-width: 140px; }
    .data-table th:not(:first-child),
    .data-table td:not(:first-child) { min-width: 100px; }
    .data-table td.source-cell,
    .data-table th.source-cell { min-width: 130px; }
    .data-table tbody tr:hover td { background: #f7fbff; }
    .data-table tbody tr:hover td:first-child { background: #eef5fc; }
    .data-table input, .data-table select {
        width: 100%;
        border: 1px solid #c8d4e0;
        padding: 3px 6px;
        font-size: 11px;
        border-radius: 2px;
        box-sizing: border-box;
    }
    .source-input-wrap { display: flex; flex-direction: column; gap: 3px; }
    .source-merged-input { background: #f5f8fb !important; color: #444; }

    .drc-footer-bar {
        padding: 8px 12px;
        border-top: 1px solid var(--drc-border);
        background: #fafbfc;
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .drc-excel-panel {
        padding: 40px 20px;
        text-align: center;
        color: var(--drc-muted);
    }
    .drc-excel-panel .upload-zone {
        border: 1px dashed var(--drc-border);
        padding: 30px;
        max-width: 480px;
        margin: 20px auto;
        background: #fafbfc;
    }

    /* 已选城市标签 */
    .drc-tags { display: flex; flex-wrap: wrap; gap: 4px; min-height: 24px; }
    .drc-tag {
        background: #dce9f8;
        color: var(--drc-blue-dark);
        padding: 2px 8px;
        border-radius: 2px;
        font-size: 11px;
        border: 1px solid #b8d0ea;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #b0c4d8; border-radius: 4px; }
    input:focus, select:focus { outline: none; border-color: var(--drc-blue) !important; }
    #excel-section:not(.hidden) { flex: 1; overflow: auto; }


    .drc-page-scroll { flex: 1; overflow-y: auto; padding: 10px 12px; background: var(--drc-bg); }
    .drc-filter-panel {
        background: #fff; border: 1px solid var(--drc-border); margin-bottom: 10px;
    }
    .drc-filter-panel-body {
        padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    .drc-filter-tags-row {
        display: flex; flex-wrap: wrap; gap: 6px;
        padding: 0 12px 10px;
    }
    .drc-filter-tags-row:empty { display: none; }
    .drc-stat-grid {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px;
    }
    @media (max-width: 900px) { .drc-stat-grid { grid-template-columns: repeat(2, 1fr); } }
    .drc-stat-card {
        background: #fff; border: 1px solid var(--drc-border); padding: 10px 12px;
    }
    .drc-stat-card .stat-label { font-size: 11px; color: var(--drc-muted); }
    .drc-stat-card .stat-value { font-size: 20px; font-weight: 600; margin-top: 4px; color: var(--drc-blue-dark); }
    .drc-stat-card .stat-value.green { color: #15803d; }
    .drc-stat-card .stat-value.red { color: #b91c1c; }
    .drc-stat-card .stat-value.amber { color: #a16207; }
    .drc-stat-card .stat-value.purple { color: #7c3aed; }
    .drc-panel { background: #fff; border: 1px solid var(--drc-border); margin-bottom: 10px; }
    .drc-panel-header {
        padding: 8px 12px; background: #fafbfc; border-bottom: 1px solid var(--drc-border);
        font-weight: 600; font-size: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }
    .drc-panel-footer {
        padding: 8px 12px; border-top: 1px solid var(--drc-border); background: #fafbfc;
        display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }
    .drc-panel-body .table-wrapper { max-height: 55vh; }
    .drc-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    @media (max-width: 1024px) { .drc-grid-2 { grid-template-columns: 1fr; } }
    .drc-mode-switch {
        margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
        padding: 4px 10px; border: 1px solid var(--drc-border); background: #fff; font-size: 12px;
    }
    .drc-mode-hint { font-size: 11px; color: var(--drc-blue); background: var(--drc-blue-light); padding: 2px 8px; border-radius: 2px; }
    .filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
    .filter-select, .replenish-input, .replenish-select {
        border: 1px solid var(--drc-border); padding: 3px 8px; font-size: 12px; border-radius: 2px; background: #fff;
    }
    .progress-bar { height: 6px; background: #dde4ec; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width .3s; }
    .progress-fill.high { background: #10b981; }
    .progress-fill.medium { background: #f59e0b; }
    .progress-fill.low { background: #ef4444; }
    .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 2px; font-size: 11px; }
    .status-imported { background: #dcfce7; color: #15803d; }
    .status-missing { background: #fee2e2; color: #b91c1c; }
    .status-partial { background: #fef9c3; color: #a16207; }
    .value-cell { font-family: Monaco, Consolas, monospace; font-size: 11px; }
    .value-present { color: var(--drc-blue-dark); }
    .value-absent { color: #999; font-style: italic; }
    .selected-indicator-tag, .drc-selected-tag-inline {
        background: #dce9f8; color: var(--drc-blue-dark); padding: 2px 8px; border-radius: 2px;
        font-size: 11px; border: 1px solid #b8d0ea; display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-replenish { background: #15803d; color: #fff; padding: 3px 10px; border: none; border-radius: 2px; font-size: 11px; cursor: pointer; }
    .btn-replenish:hover { background: #166534; }
    .btn-replenish-batch {
        background: var(--drc-blue); border: 1px solid var(--drc-blue); color: #fff;
        padding: 6px 14px; border-radius: 2px; font-size: 12px; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-replenish-batch:disabled { background: #94a3b8; border-color: #94a3b8; cursor: not-allowed; }
    .replenish-footer { padding: 8px 12px; border-top: 1px solid var(--drc-border); background: #fafbfc; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .group-stat-item { background: #f5f8fb; border: 1px solid var(--drc-border); padding: 8px; font-size: 11px; }
    /* 指标弹窗 - 保留原 class 名供 JS 使用 */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 200;
        display: none; justify-content: center; align-items: center;
    }
    .modal-content {
        background: #fff; border: 1px solid var(--drc-border); border-radius: 4px;
        box-shadow: 0 8px 32px rgba(0,0,0,.18); width: min(720px, 92vw); overflow: hidden;
    }
    .modal-header {
        padding: 10px 16px; background: var(--drc-blue-light); border-bottom: 1px solid var(--drc-border);
        color: var(--drc-blue-dark); display: flex; justify-content: space-between; align-items: center;
    }
    .modal-title { font-size: 13px; font-weight: 600; }
    .close-btn { background: none; border: none; color: #666; font-size: 18px; cursor: pointer; line-height: 1; }
    .modal-body { padding: 12px 16px; }
    .two-columns { display: flex; gap: 12px; height: 360px; }
    .column { flex: 1; display: flex; flex-direction: column; border: 1px solid var(--drc-border); overflow: hidden; background: #fff; min-height: 0; }
    .column-header { padding: 8px 12px; background: #f5f8fb; border-bottom: 1px solid var(--drc-border); font-weight: 600; font-size: 12px; }
    .column-content { flex: 1; overflow-y: auto; min-height: 0; }
    .item { padding: 7px 12px; border-bottom: 1px solid #eef2f6; cursor: pointer; font-size: 12px; }
    .item:hover { background: #f0f6fc; }
    .item.selected { background: #dce9f8; border-left: 3px solid var(--drc-blue); color: var(--drc-blue-dark); font-weight: 600; }
    .no-data { padding: 24px; color: #999; text-align: center; font-size: 12px; }
    .selection-result { background: #f5f8fb; border: 1px solid var(--drc-border); padding: 8px 12px; margin-top: 12px; font-size: 12px; }
    #selectedIndicatorsTags { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; margin-top: 4px; }
    .hidden { display: none !important; }

</style>
</head>
<body>

<header class="drc-header">
    <div class="logo-title">
        <iconify-icon icon="mdi:chart-timeline-variant" style="font-size:20px"></iconify-icon>
        城策智库 · 统计数据管理平台
    </div>
    <nav class="nav-links">
        <a href="/dashboard/">指标录入</a>
        <a href="/dashboard/order-price/">订单价格</a>
        <a href="/dashboard/single-indicator-year-query/">单指标历年</a>
        <a href="/dashboard/single-indicator-city-query/">单指标多城市</a>
        <a href="/dashboard/many-indicator-query/">多城市多指标</a>
        <a href="{% url 'landing:home' %}">返回首页</a>
    </nav>
</header>

<div class="drc-toolbar">
    <div class="drc-toolbar-row">
        <a href="/dashboard/" class="drc-tab-link">地市录入</a><a href="/dashboard/area_input" class="drc-tab-link">区县录入</a><a href="/dashboard/indicator-check" class="drc-tab-link active">指标校验</a><a href="/dashboard/indicator-coverage" class="drc-tab-link">指标覆盖查询</a><a href="/dashboard/special-indicator-query/" class="drc-tab-link">关键指标查询</a>
    </div>
</div>

<div class="drc-workspace">
<div class="drc-main">
<div class="drc-page-scroll">

    <div class="drc-filter-panel">
        <div class="drc-panel-header">
            <span>查询条件</span>
            <div class="drc-mode-switch">
                <iconify-icon icon="mdi:swap-horizontal" style="color:var(--drc-blue)"></iconify-icon>
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                    <input type="checkbox" id="modeSwitch" style="accent-color:var(--drc-blue)">
                    <span>切换到区县校验</span>
                </label>
                <span class="drc-mode-hint" id="modeHint">地市校验</span>
            </div>
            <button id="exportBtn" type="button" class="drc-btn"><iconify-icon icon="mdi:download"></iconify-icon> 导出核对表</button>
        </div>
        <div class="drc-filter-panel-body">
            <div class="drc-field"><label>年份</label><select id="yearSelect"><option value="">所有年份</option></select></div>
            <div class="drc-field"><label>省份</label><select id="provinceSelect"><option value="">全部省份</option></select></div>
            <div class="drc-field"><label>城市</label><select id="citySelect"><option value="">全部城市</option></select></div>
            <div class="drc-field hidden" id="areaField"><label>区县</label><select id="areaSelect"><option value="">全部区县</option></select></div>
            <div class="drc-field">
                <label>指标（多选）</label>
                <select id="indicatorSelect" style="min-width:160px">
                    <option value="">全部指标</option>
                    <option value="custom-selector">打开指标项</option>
                </select>
            </div>
            <div class="drc-field"><label>录入状态</label>
                <select id="statusFilter">
                    <option value="">全部</option>
                    <option value="imported">已录入</option>
                    <option value="missing">未录入</option>
                </select>
            </div>
            <button id="queryBtn" type="button" class="drc-btn drc-btn-primary"><iconify-icon icon="mdi:refresh"></iconify-icon> 查询核对</button>
        </div>
        <div id="selectedIndicatorsTags" class="drc-filter-tags-row"></div>
    </div>

    <div class="modal-overlay" id="indicatorModalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">选择指标</div>
                <button class="close-btn" id="closeIndicatorModal" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <div class="two-columns">
                    <div class="column">
                        <div class="column-header">分类</div>
                        <div class="column-content" id="indicatorFirstColumn"></div>
                    </div>
                    <div class="column">
                        <div class="column-header">指标项</div>
                        <div class="column-content" id="indicatorSecondColumn"><div class="no-data">请选择左侧分类</div></div>
                    </div>
                </div>
                <div class="selection-result" id="indicatorModalResult"><p id="indicatorModalResultContent">请选择分类</p></div>
                <div style="text-align:right;margin-top:12px">
                    <button id="confirmIndicatorBtn" type="button" class="drc-btn drc-btn-primary">确认选择</button>
                </div>
            </div>
        </div>
    </div>

    <div class="drc-stat-grid">
        <div class="drc-stat-card"><div class="stat-label">指标总数</div><div class="stat-value" id="totalIndicators">0</div></div>
        <div class="drc-stat-card"><div class="stat-label">已录入指标数</div><div class="stat-value green" id="importedCount">0</div></div>
        <div class="drc-stat-card"><div class="stat-label">未录入指标数</div><div class="stat-value red" id="missingCount">0</div></div>
        <div class="drc-stat-card"><div class="stat-label">录入覆盖率</div><div class="stat-value amber" id="coverageRate">0%</div></div>
    </div>

    <div class="drc-panel">
        <div class="drc-panel-header">
            <span><iconify-icon icon="mdi:table-eye"></iconify-icon> 指标录入明细表</span>
            <span style="font-size:11px;color:var(--drc-muted);font-weight:400" id="tableInfo">请选择条件后点击查询</span>
        </div>
        <div class="drc-panel-body">
            <div class="table-wrapper">
                <table class="data-table w-full" id="dataTable">
                    <thead>
                        <tr id="tableHeader">
                            <th>城市</th><th>指标名称</th><th>年份</th><th>录入数值</th><th>单位</th><th>录入状态</th><th>录入方式</th><th>数据来源</th><th>备注</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="8" style="text-align:center;color:#999;padding:32px">请选择条件后点击查询按钮</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="drc-panel-footer">
            <div style="font-size:11px;color:var(--drc-muted)" id="paginationInfo"></div>
            <div style="display:flex;gap:6px">
                <button id="prevPage" type="button" class="drc-btn">上一页</button>
                <button id="nextPage" type="button" class="drc-btn">下一页</button>
            </div>
        </div>
    </div>

    <div class="drc-panel">
        <div class="drc-panel-header"><span><iconify-icon icon="mdi:chart-box"></iconify-icon> 按指标组统计录入情况</span></div>
        <div class="drc-panel-body" style="padding:10px 12px">
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px" id="groupStats"></div>
        </div>
    </div>

</div>
</div>
</div>
<script>
    let dataDict = {};
    let auditScope = 'city';

    const selectedIndicatorValues = new Set();
    let selectedIndicatorCategory = null;

    let provinceCityMap = {};
    let filteredData = [];
    let currentPage = 1;
    let totalPages = 1;
    let totalRecords = 0;
    const pageSize = 50;
    let lastSummary = null;
    let lastGroupStats = null;

    async function parseApiResponse(res, label) {
        const text = await res.text();
        if (!text) throw new Error(`${label}：服务器返回空响应 (HTTP ${res.status})`);
        let json;
        try { json = JSON.parse(text); } catch (e) {
            throw new Error(`${label}：服务器返回非 JSON (HTTP ${res.status})`);
        }
        return json;
    }
    
    // // 省份-城市映射（用于筛选）
    // const provinceCityMap = {
    //     "北京市": ["北京市"], "上海市": ["上海市"], "广东省": ["广州市", "深圳市"], "浙江省": ["杭州市"],
    //     "四川省": ["成都市"], "湖北省": ["武汉市"], "江苏省": ["南京市", "苏州市"], "天津市": ["天津市"]
    // };
    function loadProvinceCityMap() { 
        return fetch('/dashboard/get-city-map/')
            .then(res=>res.json())
            .then(data=>{ provinceCityMap=data||{}; })
            .catch(()=>{ provinceCityMap={
                "北京市": ["北京市"], "天津市": ["天津市"], "上海市": ["上海市"], "重庆市": ["重庆市"],
                "江苏省": ["南京市", "苏州市", "无锡市", "常州市"],
                "浙江省": ["杭州市", "宁波市", "温州市"],
                "广东省": ["广州市", "深圳市", "珠海市", "佛山市"]
            }; });
    }

    
    async function initYearSelect() {
        const yearSelect = document.getElementById('yearSelect');
        yearSelect.innerHTML = '<option value="">默认年份</option>';
        let years = [];
        let defaultYear = null;
        let yearCounts = {};
        try {
            const res = await fetch(`/dashboard/api/indicator-audit-years/?scope=${auditScope}`, { credentials: 'same-origin' });
            const json = await parseApiResponse(res, '年份列表');
            if (json.success) {
                years = json.years || [];
                defaultYear = json.default_year;
                yearCounts = json.year_counts || {};
            }
        } catch (e) {
            console.warn('加载年份失败', e);
        }
        years.forEach(y => {
            const opt = document.createElement('option');
            opt.value = y;
            const count = yearCounts[y];
            opt.textContent = count ? `${y}年 (${count}条)` : `${y}年`;
            if (y === defaultYear) opt.selected = true;
            yearSelect.appendChild(opt);
        });
    }

    function loadCatalogForScope() {
        if (auditScope === 'area') {
            return IndicatorCatalog.loadArea().then(function (dict) {
                dataDict = dict || {};
            });
        }
        return IndicatorCatalog.load().then(function (dict) {
            dataDict = dict || {};
        });
    }

    async function updateAreaSelect() {
        const areaField = document.getElementById('areaField');
        const areaSelect = document.getElementById('areaSelect');
        if (!areaField || !areaSelect) return;
        if (auditScope !== 'area') {
            areaField.classList.add('hidden');
            areaSelect.innerHTML = '<option value="">全部区县</option>';
            return;
        }
        areaField.classList.remove('hidden');
        const city = document.getElementById('citySelect').value;
        areaSelect.innerHTML = '<option value="">全部区县</option>';
        if (!city) return;
        try {
            const res = await fetch(`/dashboard/get-area-map/?city=${encodeURIComponent(city)}`, { credentials: 'same-origin' });
            const areas = await res.json();
            if (!Array.isArray(areas) || !areas.length) {
                areaSelect.innerHTML = '<option value="">该城市暂无区县数据</option>';
                return;
            }
            areas.forEach(area => {
                const opt = document.createElement('option');
                opt.value = area;
                opt.textContent = area;
                areaSelect.appendChild(opt);
            });
        } catch (e) {
            console.warn('加载区县失败', e);
            areaSelect.innerHTML = '<option value="">区县加载失败</option>';
        }
    }

    function updateTableHeader() {
        const header = document.getElementById('tableHeader');
        if (!header) return;
        if (auditScope === 'area') {
            header.innerHTML = '<th>城市</th><th>区县</th><th>指标名称</th><th>年份</th><th>录入数值</th><th>单位</th><th>录入状态</th><th>录入方式</th><th>数据来源</th><th>备注</th>';
        } else {
            header.innerHTML = '<th>城市</th><th>指标名称</th><th>年份</th><th>录入数值</th><th>单位</th><th>录入状态</th><th>录入方式</th><th>数据来源</th><th>备注</th>';
        }
    }

    function switchAuditMode() {
        const isArea = document.getElementById('modeSwitch').checked;
        const modeHint = document.getElementById('modeHint');
        const nextScope = isArea ? 'area' : 'city';
        if (nextScope === auditScope) return;

        auditScope = nextScope;
        selectedIndicatorValues.clear();
        selectedIndicatorCategory = null;
        renderSelectedIndicatorTags();
        currentPage = 1;

        if (isArea) {
            modeHint.textContent = '区县校验';
            modeHint.className = 'drc-mode-hint';
            modeHint.style.background = '#fef3c7';
            modeHint.style.color = '#a16207';
        } else {
            modeHint.textContent = '地市校验';
            modeHint.className = 'drc-mode-hint';
            modeHint.style.background = '';
            modeHint.style.color = '';
        }

        updateTableHeader();
        loadCatalogForScope()
            .then(() => initYearSelect())
            .then(() => updateAreaSelect())
            .then(() => performQuery())
            .catch(err => console.error('切换校验模式失败', err));
    }
    
    // 初始化省份下拉
    function initProvinceSelect() {
        const provSelect = document.getElementById('provinceSelect');
        const provinces = Object.keys(provinceCityMap);
        provSelect.innerHTML = '<option value="">全部省份</option>';
        provinces.forEach(prov => {
            const opt = document.createElement('option');
            opt.value = prov;
            opt.textContent = prov;
            provSelect.appendChild(opt);
        });
    }
    
    // 省份联动城市
    function updateCitySelect() {
        const province = document.getElementById('provinceSelect').value;
        const citySelect = document.getElementById('citySelect');
        let cities = [];
        if (province && provinceCityMap[province]) {
            cities = provinceCityMap[province];
        } else {
            for (const p in provinceCityMap) cities = cities.concat(provinceCityMap[p]);
        }
        citySelect.innerHTML = '<option value="">全部城市</option>';
        cities.forEach(city => {
            const opt = document.createElement('option');
            opt.value = city;
            opt.textContent = city;
            citySelect.appendChild(opt);
        });
        updateAreaSelect();
    }
    
    function renderSelectedIndicatorTags() {
        const container = document.getElementById('selectedIndicatorsTags');
        const select = document.getElementById('indicatorSelect');
        if (!container) return;
        container.innerHTML = '';
        if (selectedIndicatorValues.size === 0) {
            if (select) select.options[0].textContent = '全部指标';
            return;
        }
        selectedIndicatorValues.forEach(name => {
            const tag = document.createElement('span');
            tag.className = 'selected-indicator-tag';
            tag.textContent = name;
            container.appendChild(tag);
        });
        if (select) {
            const list = Array.from(selectedIndicatorValues).join('、');
            const truncated = list.length > 36 ? list.slice(0, 36) + '...' : list;
            select.options[0].textContent = `已选 ${selectedIndicatorValues.size} 项：${truncated}`;
        }
    }

    function setupIndicatorModal() {
        const indicatorSelect = document.getElementById('indicatorSelect');
        const modalOverlay = document.getElementById('indicatorModalOverlay');
        const closeBtn = document.getElementById('closeIndicatorModal');
        const firstColumn = document.getElementById('indicatorFirstColumn');
        const secondColumn = document.getElementById('indicatorSecondColumn');
        const resultContent = document.getElementById('indicatorModalResultContent');
        const confirmBtn = document.getElementById('confirmIndicatorBtn');
        if (!indicatorSelect || !modalOverlay) return;

        function highlightCategory(category) {
            document.querySelectorAll('#indicatorFirstColumn .item').forEach(item => {
                item.classList.toggle('selected', item.textContent === category);
            });
        }

        function populateSecondColumn(category) {
            secondColumn.innerHTML = '';
            if (!category || !dataDict[category]) {
                secondColumn.innerHTML = '<div class="no-data">无数据</div>';
                return;
            }
            dataDict[category].forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.textContent = item;
                if (selectedIndicatorValues.has(item)) itemDiv.classList.add('selected');
                itemDiv.addEventListener('click', () => {
                    if (selectedIndicatorValues.has(item)) {
                        selectedIndicatorValues.delete(item);
                        itemDiv.classList.remove('selected');
                    } else {
                        selectedIndicatorValues.add(item);
                        itemDiv.classList.add('selected');
                    }
                    updateModalResult();
                });
                secondColumn.appendChild(itemDiv);
            });
            updateModalResult();
        }

        function populateFirstColumn() {
            firstColumn.innerHTML = '';
            Object.keys(dataDict).forEach(category => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.textContent = category;
                itemDiv.addEventListener('click', () => {
                    selectedIndicatorCategory = category;
                    highlightCategory(category);
                    populateSecondColumn(category);
                });
                firstColumn.appendChild(itemDiv);
            });
            const first = Object.keys(dataDict)[0];
            if (first) {
                selectedIndicatorCategory = first;
                highlightCategory(first);
                populateSecondColumn(first);
            }
        }

        function updateModalResult() {
            if (!resultContent) return;
            resultContent.textContent = selectedIndicatorValues.size === 0
                ? `已选择分类: ${selectedIndicatorCategory || ''}，请从右侧选择具体指标`
                : `已选择 (${selectedIndicatorValues.size}): ${Array.from(selectedIndicatorValues).join('、')}`;
        }

        indicatorSelect.addEventListener('change', function() {
            if (this.value === 'custom-selector') {
                modalOverlay.style.display = 'flex';
                populateFirstColumn();
                this.value = '';
            }
        });

        closeBtn?.addEventListener('click', () => { modalOverlay.style.display = 'none'; });
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.style.display = 'none';
        });

        confirmBtn?.addEventListener('click', () => {
            modalOverlay.style.display = 'none';
            renderSelectedIndicatorTags();
            performQuery();
        });
    }

    async function filterData(page = currentPage) {
        currentPage = page;
        const year = document.getElementById('yearSelect').value;
        const province = document.getElementById('provinceSelect').value;
        const city = document.getElementById('citySelect').value;
        const status = document.getElementById('statusFilter').value;
        const indicators = Array.from(selectedIndicatorValues).join(',');

        const params = new URLSearchParams({
            scope: auditScope,
            year: year || '',
            province: province || '',
            city: city || '',
            indicators: indicators || '',
            status: status || '',
            page: String(currentPage),
            page_size: String(pageSize),
        });
        if (auditScope === 'area') {
            const area = document.getElementById('areaSelect')?.value || '';
            if (area) params.set('area', area);
        }

        const queryBtn = document.getElementById('queryBtn');
        const originalText = queryBtn.innerHTML;
        queryBtn.innerHTML = '<iconify-icon icon="mdi:loading" class="animate-spin"></iconify-icon> 查询中...';
        queryBtn.disabled = true;

        try {
            const res = await fetch(`/dashboard/api/check-data/?${params}`, { credentials: 'same-origin' });
            const data = await parseApiResponse(res, '指标校验');
            if (!data.success) throw new Error(data.message || '查询失败');

            filteredData = data.records || [];
            totalRecords = data.total || 0;
            totalPages = data.total_pages || 1;
            lastSummary = data.summary || null;
            lastGroupStats = data.group_stats || null;

            updateStatistics();
            updateGroupStats();
            renderTable();
            document.getElementById('tableInfo').textContent =
                data.years?.length ? `查询年份：${data.years.join('、')}` : '';
        } catch (error) {
            console.error('查询失败:', error);
            alert('查询失败：' + (error.message || '请稍后重试'));
            filteredData = [];
            renderTable();
        } finally {
            queryBtn.innerHTML = originalText;
            queryBtn.disabled = false;
        }
    }

    function updateStatistics() {
        const s = lastSummary || { total: 0, imported: 0, missing: 0, coverage_rate: 0 };
        document.getElementById('totalIndicators').innerText = s.total;
        document.getElementById('importedCount').innerText = s.imported;
        document.getElementById('missingCount').innerText = s.missing;
        document.getElementById('coverageRate').innerText = s.coverage_rate + '%';
    }

    function updateGroupStats() {
        const container = document.getElementById('groupStats');
        container.innerHTML = '';
        const stats = lastGroupStats || {};
        for (const [key, stat] of Object.entries(stats)) {
            if (!stat.total) continue;
            const rate = stat.rate ?? 0;
            const colorClass = rate >= 80 ? 'border-green-200 bg-green-50' : (rate >= 50 ? 'border-yellow-200 bg-yellow-50' : 'border-red-200 bg-red-50');
            const textColor = rate >= 80 ? 'text-green-700' : (rate >= 50 ? 'text-yellow-700' : 'text-red-700');
            container.innerHTML += `
                <div class="border ${colorClass} rounded-xl p-3 text-center">
                    <div class="text-xs text-slate-500">${stat.name}</div>
                    <div class="text-xl font-bold ${textColor}">${rate}%</div>
                    <div class="text-xs text-slate-400">${stat.imported}/${stat.total}</div>
                </div>
            `;
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const pageData = filteredData;
        const colSpan = auditScope === 'area' ? 10 : 9;

        if (pageData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${colSpan}" class="text-center text-slate-400 py-12">暂无数据，请调整筛选条件</td></tr>`;
            document.getElementById('paginationInfo').innerText = totalRecords
                ? `共 ${totalRecords} 条，当前第 ${currentPage}/${totalPages} 页`
                : '';
            document.getElementById('prevPage').disabled = true;
            document.getElementById('nextPage').disabled = true;
            return;
        }

        tbody.innerHTML = '';
        pageData.forEach(record => {
            const statusBadge = record.status === 'imported' 
                ? '<span class="status-badge status-imported"><iconify-icon icon="mdi:check-circle" width="14"></iconify-icon>已录入</span>'
                : '<span class="status-badge status-missing"><iconify-icon icon="mdi:close-circle" width="14"></iconify-icon>未录入</span>';
            
            const valueDisplay = record.value 
                ? `<span class="value-cell value-present font-medium">${parseFloat(record.value).toLocaleString()}</span>`
                : '<span class="value-cell value-absent">— 未录入 —</span>';
            
            const sourceDisplay = record.source_display || '—';
            const inputMethodDisplay = record.input_method_display || '—';
            const remarkDisplay = record.remark ? record.remark : '—';
            
            const row = document.createElement('tr');
            row.className = 'hover:bg-blue-50/30 transition-colors';
            const areaCell = auditScope === 'area'
                ? `<td class="text-slate-700">${record.area || '—'}</td>`
                : '';
            row.innerHTML = `
                <td class="font-medium text-slate-800">${record.city}</td>
                ${areaCell}
                <td class="text-slate-700">${record.indicator}</td>
                <td class="text-slate-600">${record.year}年</td>
                <td class="text-right">${valueDisplay}</td>
                <td class="text-slate-500 text-sm">${record.unit || '—'}</td>
                <td>${statusBadge}</td>
                <td class="text-slate-500 text-sm">${inputMethodDisplay}</td>
                <td class="text-slate-500 text-sm">${sourceDisplay}</td>
                <td class="text-slate-500 text-sm max-w-[150px] truncate" title="${remarkDisplay}">${remarkDisplay}</td>
            `;
            tbody.appendChild(row);
        });
        
        document.getElementById('paginationInfo').innerText =
            `第 ${currentPage} / ${totalPages || 1} 页，共 ${totalRecords} 条记录`;

        document.getElementById('prevPage').disabled = currentPage <= 1;
        document.getElementById('nextPage').disabled = currentPage >= totalPages;
    }
    
    // 导出CSV
    function exportToCSV() {
        if (filteredData.length === 0) {
            alert('暂无数据可导出');
            return;
        }
        const headers = auditScope === 'area'
            ? ['城市', '区县', '指标名称', '年份', '录入数值', '单位', '录入状态', '录入方式', '数据来源', '备注']
            : ['城市', '指标名称', '年份', '录入数值', '单位', '录入状态', '录入方式', '数据来源', '备注'];
        const rows = filteredData.map(record => {
            const base = [
                record.city,
                record.indicator,
                record.year,
                record.value || '',
                record.unit || '',
                record.status === 'imported' ? '已录入' : '未录入',
                record.input_method_display || '',
                record.source_display || '',
                record.remark || '',
            ];
            if (auditScope === 'area') {
                base.splice(1, 0, record.area || '');
            }
            return base;
        });
        
        const csvContent = [headers, ...rows].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute('download', `指标核对数据_${new Date().toISOString().slice(0,19)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
    
    function performQuery() {
        filterData(1);
    }

    function bindEvents() {
        document.getElementById('provinceSelect').addEventListener('change', updateCitySelect);
        document.getElementById('citySelect').addEventListener('change', updateAreaSelect);
        document.getElementById('modeSwitch').addEventListener('change', switchAuditMode);
        document.getElementById('queryBtn').addEventListener('click', performQuery);
        document.getElementById('exportBtn').addEventListener('click', exportToCSV);
        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) filterData(currentPage - 1);
        });
        document.getElementById('nextPage').addEventListener('click', () => {
            if (currentPage < totalPages) filterData(currentPage + 1);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        updateTableHeader();
        loadCatalogForScope()
            .catch(function (err) { console.error('加载指标目录失败', err); })
            .finally(function () {
                setupIndicatorModal();
                loadProvinceCityMap().then(async () => {
                    await initYearSelect();
                    initProvinceSelect();
                    updateCitySelect();
                    bindEvents();
                    performQuery();
                }).catch(async (error) => {
                    console.error('加载省份城市数据失败:', error);
                    provinceCityMap = {
                        "北京市": ["北京市"], "天津市": ["天津市"], "上海市": ["上海市"], "重庆市": ["重庆市"],
                        "江苏省": ["南京市", "苏州市"], "浙江省": ["杭州市"], "广东省": ["广州市", "深圳市"]
                    };
                    await initYearSelect();
                    initProvinceSelect();
                    updateCitySelect();
                    bindEvents();
                    performQuery();
                });
            });
    });



</script>
</body>
</html>
