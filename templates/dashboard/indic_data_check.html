<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>指标数据核对查询 | 数据指标管理系统</title>
<script src="/static/js/tailwindcss.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/iconify/3.1.1/iconify.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
    body {
        background: #f0f4f9;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 表格容器支持横向滚动 */
    .table-wrapper {
        overflow-x: auto;
        overflow-y: auto;
        max-height: 65vh;
        width: 100%;
        border-radius: 1rem;
    }
    
    /* 数据表格样式 */
    .data-table {
        min-width: 800px;
        width: max-content;
        border-collapse: collapse;
    }
    
    /* 固定第一列（城市/区县） */
    .data-table th:first-child,
    .data-table td:first-child {
        position: sticky;
        left: 0;
        background: #ffffff;
        z-index: 10;
        box-shadow: 4px 0 8px -4px rgba(0, 80, 120, 0.15);
    }
    
    .data-table thead th:first-child {
        z-index: 11;
        background: #f0f9ff;
    }
    
    .data-table th,
    .data-table td {
        border: 1px solid #bfdbfe;
        padding: 10px 14px;
        vertical-align: middle;
    }
    
    .data-table th {
        background: #f8fafc;
        font-weight: 600;
        color: #1e40af;
    }
    
    /* 状态标签样式 */
    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 500;
    }
    .status-imported {
        background: #dcfce7;
        color: #15803d;
    }
    .status-missing {
        background: #fee2e2;
        color: #b91c1c;
    }
    .status-partial {
        background: #fef9c3;
        color: #a16207;
    }
    
    /* 数值单元格样式 */
    .value-cell {
        font-family: 'Monaco', 'Consolas', monospace;
        font-weight: 500;
    }
    .value-present {
        color: #1e40af;
    }
    .value-absent {
        color: #94a3b8;
        font-style: italic;
    }
    
    /* 滚动条 */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: #e2e8f0;
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 10px;
    }
    
    input:focus, select:focus {
        outline: none;
        border-color: #3b82f6 !important;
        box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
    }
    
    /* 折叠面板 */
    .collapsible-header {
        cursor: pointer;
        transition: all 0.2s;
    }
    .collapsible-content {
        transition: all 0.3s ease;
        overflow: hidden;
    }

    /* 指标选择弹窗（与多城市多指标查询一致） */
    .modal-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .modal-content {
        background-color: white;
        width: 90%;
        max-width: 700px;
        border-radius: 1rem;
        box-shadow: 0 20px 35px -8px rgba(0,0,0,0.2);
        overflow: hidden;
    }
    .modal-header {
        background: #1e3a8a;
        color: white;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .modal-title { font-size: 1.2rem; font-weight: 600; }
    .close-btn {
        background: none; border: none; color: white;
        font-size: 1.8rem; cursor: pointer; line-height: 1; opacity: 0.8;
    }
    .close-btn:hover { opacity: 1; }
    .modal-body { padding: 20px; }
    .two-columns { display: flex; gap: 20px; height: 350px; }
    .column {
        flex: 1; display: flex; flex-direction: column;
        border: 1px solid #e2e8f0; border-radius: 0.75rem;
        overflow: hidden; background: white;
    }
    .column-header {
        background: #f8fafc; padding: 12px; font-weight: 600;
        color: #1e293b; border-bottom: 1px solid #e2e8f0;
    }
    .column-content { flex: 1; overflow-y: auto; }
    .item {
        padding: 10px 16px; border-bottom: 1px solid #f1f5f9;
        cursor: pointer; transition: all 0.15s; color: #334155;
    }
    .item:hover { background-color: #eff6ff; }
    .item.selected {
        background-color: #dbeafe; border-left: 3px solid #3b82f6;
        color: #1e40af; font-weight: 500;
    }
    .no-data { padding: 30px 20px; color: #94a3b8; text-align: center; }
    .selection-result {
        background-color: #f8fafc; border-radius: 0.75rem;
        padding: 12px 16px; margin-top: 20px; border-left: 4px solid #3b82f6;
    }
    .selected-indicator-tag {
        background: #dbeafe; color: #1e40af;
        padding: 4px 12px; border-radius: 20px; font-size: 12px;
        display: inline-flex; align-items: center; gap: 6px; margin: 2px;
    }
</style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen font-sans antialiased">

<!-- 导航栏 -->
<header class="bg-white border-b border-blue-200 shadow-sm h-20 flex items-center px-8 sticky top-0 z-50 backdrop-blur-sm bg-white/95">
<div class="flex items-center space-x-3">
    <div class="bg-blue-600 rounded-xl p-2 shadow-md">
        <iconify-icon class="text-white text-2xl" icon="mdi:chart-line"></iconify-icon>

</div>
<div class="ml-auto flex items-center space-x-4">
    <div class="flex space-x-3 mr-6">

        <a href="/dashboard/single-indicator-year-query/" class="text-slate-700 hover:text-blue-700 font-medium py-2 px-4 rounded-lg text-sm border border-slate-300 hover:border-blue-400 transition">单指标历年查询</a>
        <a href="/dashboard/single-indicator-city-query/" class="text-slate-700 hover:text-blue-700 font-medium py-2 px-4 rounded-lg text-sm border border-slate-300 hover:border-blue-400 transition">单指标多城市</a>
        <a href="/dashboard/many-indicator-query/" class="text-slate-700 hover:text-blue-700 font-medium py-2 px-4 rounded-lg text-sm border border-slate-300 hover:border-blue-400 transition">多城市多指标</a>
    </div>
    <div class="text-right">
        <div class="flex-shrink-0 flex items-center">
            <a href="{% url 'landing:home' %}" class="flex items-center">

            </a>
        </div>

    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center shadow-inner">

</div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">

    <div class="flex items-center space-x-3 mb-6">
        <div class="bg-blue-100 p-2 rounded-xl">
            <iconify-icon class="text-blue-600 text-2xl" icon="fluent:database-search-24-filled"></iconify-icon>
        </div>
        <div class="flex space-x-3">

            <a href="/dashboard/area_input" class="bg-white border border-slate-300 text-slate-700 font-medium py-2 px-5 rounded-xl hover:bg-slate-50 transition">区县指标录入</a>
            <a href="/dashboard/indicator-check" class="bg-blue-600 text-white font-medium py-2 px-5 rounded-xl shadow-sm hover:bg-blue-700 transition">指标校验</a>

        </div>
    </div>

    <!-- 页面标题 -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center space-x-3">
            <!-- <div class="bg-blue-100 p-2 rounded-xl">
                <iconify-icon class="text-blue-600 text-2xl" icon="mdi:clipboard-list"></iconify-icon>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">指标数据核对查询</h1>
            <span class="text-sm text-slate-500 bg-slate-100 px-3 py-1 rounded-full">查看各指标录入状态与数值</span> -->
        </div>
        <div class="flex items-center gap-3">
            <button id="exportBtn" class="bg-white border border-blue-300 hover:bg-blue-50 text-blue-700 font-medium py-2 px-4 rounded-xl text-sm transition flex items-center gap-2">

            </button>
        </div>
    </div>

    <!-- 筛选卡片 -->
    <div class="bg-white border border-blue-200 rounded-2xl shadow-md p-6 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-5">
            <div>
                <label class="block text-sm font-semibold text-blue-700 mb-2">📅 选择年份</label>
                <select id="yearSelect" class="w-full bg-white border border-slate-300 rounded-xl py-2.5 px-4 text-slate-700 focus:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none">
                    <option value="">所有年份</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-blue-700 mb-2">📍 选择省份</label>
                <select id="provinceSelect" class="w-full bg-white border border-slate-300 rounded-xl py-2.5 px-4 text-slate-700 focus:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none">
                    <option value="">全部省份</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-blue-700 mb-2">🏙️ 选择城市</label>
                <select id="citySelect" class="w-full bg-white border border-slate-300 rounded-xl py-2.5 px-4 text-slate-700 focus:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none">

                </select>
            </div>
            <div class="min-w-0">
                <label class="block text-sm font-semibold text-blue-700 mb-2">📊 选择指标（多选）</label>

            </div>
            <div>

                <select id="statusFilter" class="w-full bg-white border border-slate-300 rounded-xl py-2.5 px-4 text-slate-700 focus:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none">
                    <option value="">全部</option>
                    <option value="imported">已录入</option>
                    <option value="missing">未录入</option>
                </select>
            </div>
        </div>
        <div class="flex justify-end mt-5">
            <button id="queryBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-8 rounded-xl shadow-md transition-all flex items-center gap-2">
                <iconify-icon icon="mdi:refresh"></iconify-icon> 查询核对
            </button>
        </div>
    </div>

    <!-- 指标选择弹窗 -->
    <div class="modal-overlay" id="indicatorModalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">选择指标</div>
                <button class="close-btn" id="closeIndicatorModal" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <div class="two-columns">
                    <div class="column">
                        <div class="column-header">分类</div>
                        <div class="column-content" id="indicatorFirstColumn"></div>
                    </div>
                    <div class="column">
                        <div class="column-header">指标项</div>
                        <div class="column-content" id="indicatorSecondColumn"><div class="no-data">请选择左侧分类</div></div>
                    </div>
                </div>
                <div class="selection-result" id="indicatorModalResult">
                    <p id="indicatorModalResultContent">请选择分类</p>
                </div>
                <div style="text-align: right; margin-top: 20px;">
                    <button id="confirmIndicatorBtn" type="button" style="padding: 8px 24px; background: #2563eb; color: white; border: none; border-radius: 0.75rem; cursor: pointer; font-weight: 500;">确认选择</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white border border-blue-200 rounded-xl p-4 shadow-sm">

                </div>
            </div>
        </div>
        <div class="bg-white border border-red-200 rounded-xl p-4 shadow-sm">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-slate-500 text-sm">未录入指标数</p>
                    <p class="text-2xl font-bold text-red-500" id="missingCount">0</p>
                </div>
                <div class="bg-red-100 p-2 rounded-lg">
                    <iconify-icon class="text-red-500 text-xl" icon="mdi:alert-circle"></iconify-icon>
                </div>
            </div>
        </div>
        <div class="bg-white border border-yellow-200 rounded-xl p-4 shadow-sm">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-slate-500 text-sm">录入覆盖率</p>
                    <p class="text-2xl font-bold text-yellow-600" id="coverageRate">0%</p>
                </div>
                <div class="bg-yellow-100 p-2 rounded-lg">

                </div>
            </div>
        </div>
    </div>

    <!-- 数据表格 - 指标维度视图 -->
    <div class="bg-white border border-blue-200 rounded-2xl shadow-md overflow-hidden">
        <div class="px-6 py-4 border-b border-blue-200 bg-slate-50 flex justify-between items-center">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <iconify-icon icon="mdi:table-eye"></iconify-icon>
                指标录入明细表
            </h2>
            <div class="text-xs text-slate-400" id="tableInfo">请选择条件后点击查询</div>
        </div>
        <div class="table-wrapper">
            <table class="data-table w-full" id="dataTable">
                <thead>
                    <tr id="tableHeader">
                        <th class="min-w-[120px]">城市</th>
                        <th class="min-w-[150px]">指标名称</th>
                        <th class="min-w-[100px]">年份</th>
                        <th class="min-w-[150px]">录入数值</th>
                        <th class="min-w-[120px]">单位</th>
                        <th class="min-w-[120px]">录入状态</th>
                        <th class="min-w-[150px]">数据来源</th>
                        <th class="min-w-[100px]">备注</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="8" class="text-center text-slate-400 py-12">请选择条件后点击查询按钮</td>

        </div>
        <!-- 分页 -->
        <div class="px-6 py-3 bg-slate-50 border-t border-blue-200 flex justify-between items-center">

            <div class="flex gap-2">

    <!-- 汇总卡片 - 按指标组统计 -->

        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3" id="groupStats">
            <!-- 动态生成组统计卡片 -->
        </div>
    </div>
</main>

<script>
    // 指标字典（与 many_indic_query.html 一致）

        '生态环保数据': ['园林绿地面积', '二氧化硫排放总量', '工业二氧化硫排放量', '森林覆盖率', '水土流失治理面积', '工业废水排放总量', '工业固体废弃物综合利用率', '生活垃圾无害化处理率', '城镇生活污水处理率', '城市空气质量指数', '城市区域环境噪音指数', 'PM2.5', 'PM10'],
        '市场监管数据': ['查出不正当竞争案件数', '生产安全事故死亡人数', '工矿商贸死亡人数', '亿元GDP生产安全事故死亡率', '十万人工矿商贸从业人员事故死亡率', '食品质量抽样检测合格率', '药品安全抽样合格率', '工业产品质量抽样合格率', '查处农资违法案件的数量', '查办违法广告的件数', '查办商标侵权案件的件数', '受理消费者维权案件数', '受理消费者投诉案件数', '消费者维权案件办理率'],
        '社会保障数据': ['城镇职工基本养老保险人数', '城乡居民基本养老保险人数', '城镇职工基本医疗保险人数', '城乡居民基本医疗保险人数', '城镇最低生活保障人数', '农村最低生活保障人数', '年末实有社会组织登记数量', '养老机构床位数', '城镇新增就业人数', '新建保障性住房套数'],
        '医疗卫生数据': ['卫生技术人员数量', '医疗机构病床数'],
        '基础设施数据': ['有线电视用户数', '固定宽带互联网用户数', '自来水受益村数', '村委会个数'],
        '公共安全数据': ['刑事案件立案件数', '刑事案件破案件数', '受理信访举报案件数', '调处各类矛盾纠纷件数', '成功调处各类矛盾纠纷数', '受理各类法律援助案件的数量', '火灾死亡人数', '接待群众来信来访人次'],
        '文化体育数据': ['文化馆、群众艺术馆', '博物馆', '艺术表演团体', '体育场馆', '公共图书馆'],
        '行政廉洁数据': ['贪污贿赂人数', '渎职侵权人数', '立案查处违法违纪案件数', '被依法追究责任的领导干部人数'],
        '经济增长数据': ['GDP', '人均GDP', 'GDP增长率', '一般公共预算收入', '财政总收入', '财政总收入增长率', '固定资产投资总额', '固定资产投资总额增长率', '全社会消费品零售总额', '全社会消费品零售总额增长率', '进出口总额', '进出口总额增长率', '实际利用外资金额', '实际利用外资金额增长率', '规模以上工业企业增加值'],
        '经济发展数据': ['居民消费价格指数CPI', '工业品出厂价格指数PPI'],
        '公共服务数据': ['人均城市道路面积', '高中阶段毛入学率'],
        '依法行政数据': ['行政复议案件办结率', '行政复议案件申请量', '行政案件数'],
        '政务公开数据': ['主动公开政府信息件数', '依申请公开政府信息件数', '因公开问题申请行政复议的数量']
    };

    const selectedIndicatorValues = new Set();
    let selectedIndicatorCategory = null;

    let provinceCityMap = {};
    let filteredData = [];
    let currentPage = 1;
    let totalPages = 1;
    let totalRecords = 0;
    const pageSize = 50;
    let lastSummary = null;
    let lastGroupStats = null;

    async function parseApiResponse(res, label) {
        const text = await res.text();
        if (!text) throw new Error(`${label}：服务器返回空响应 (HTTP ${res.status})`);
        let json;
        try { json = JSON.parse(text); } catch (e) {
            throw new Error(`${label}：服务器返回非 JSON (HTTP ${res.status})`);
        }
        return json;
    }
    
    // // 省份-城市映射（用于筛选）
    // const provinceCityMap = {
    //     "北京市": ["北京市"], "上海市": ["上海市"], "广东省": ["广州市", "深圳市"], "浙江省": ["杭州市"],
    //     "四川省": ["成都市"], "湖北省": ["武汉市"], "江苏省": ["南京市", "苏州市"], "天津市": ["天津市"]
    // };
    function loadProvinceCityMap() { 
        return fetch('/dashboard/get-city-map/')
            .then(res=>res.json())
            .then(data=>{ provinceCityMap=data||{}; })
            .catch(()=>{ provinceCityMap={
                "北京市": ["北京市"], "天津市": ["天津市"], "上海市": ["上海市"], "重庆市": ["重庆市"],
                "江苏省": ["南京市", "苏州市", "无锡市", "常州市"],
                "浙江省": ["杭州市", "宁波市", "温州市"],
                "广东省": ["广州市", "深圳市", "珠海市", "佛山市"]
            }; });
    }

    
    async function initYearSelect() {
        const yearSelect = document.getElementById('yearSelect');
        yearSelect.innerHTML = '<option value="">默认年份</option>';
        let years = [];
        let defaultYear = null;
        let yearCounts = {};
        try {
            const res = await fetch('/dashboard/api/indicator-audit-years/', { credentials: 'same-origin' });
            const json = await parseApiResponse(res, '年份列表');
            if (json.success) {
                years = json.years || [];
                defaultYear = json.default_year;
                yearCounts = json.year_counts || {};
            }
        } catch (e) {
            console.warn('加载年份失败', e);
        }
        years.forEach(y => {
            const opt = document.createElement('option');
            opt.value = y;
            const count = yearCounts[y];
            opt.textContent = count ? `${y}年 (${count}条)` : `${y}年`;
            if (y === defaultYear) opt.selected = true;
            yearSelect.appendChild(opt);
        });
    }
    
    // 初始化省份下拉
    function initProvinceSelect() {
        const provSelect = document.getElementById('provinceSelect');
        const provinces = Object.keys(provinceCityMap);
        provSelect.innerHTML = '<option value="">全部省份</option>';
        provinces.forEach(prov => {
            const opt = document.createElement('option');
            opt.value = prov;
            opt.textContent = prov;
            provSelect.appendChild(opt);
        });
    }
    
    // 省份联动城市
    function updateCitySelect() {
        const province = document.getElementById('provinceSelect').value;
        const citySelect = document.getElementById('citySelect');
        let cities = [];
        if (province && provinceCityMap[province]) {
            cities = provinceCityMap[province];
        } else {
            for (const p in provinceCityMap) cities = cities.concat(provinceCityMap[p]);
        }
        citySelect.innerHTML = '<option value="">全部城市</option>';
        cities.forEach(city => {
            const opt = document.createElement('option');
            opt.value = city;
            opt.textContent = city;
            citySelect.appendChild(opt);
        });
    }
    
    function renderSelectedIndicatorTags() {
        const container = document.getElementById('selectedIndicatorsTags');
        const select = document.getElementById('indicatorSelect');
        if (!container) return;
        container.innerHTML = '';
        if (selectedIndicatorValues.size === 0) {
            if (select) select.options[0].textContent = '全部指标';
            return;
        }
        selectedIndicatorValues.forEach(name => {
            const tag = document.createElement('span');
            tag.className = 'selected-indicator-tag';
            tag.textContent = name;
            container.appendChild(tag);
        });
        if (select) {
            const list = Array.from(selectedIndicatorValues).join('、');
            const truncated = list.length > 36 ? list.slice(0, 36) + '...' : list;
            select.options[0].textContent = `已选 ${selectedIndicatorValues.size} 项：${truncated}`;
        }
    }

    function setupIndicatorModal() {
        const indicatorSelect = document.getElementById('indicatorSelect');
        const modalOverlay = document.getElementById('indicatorModalOverlay');
        const closeBtn = document.getElementById('closeIndicatorModal');
        const firstColumn = document.getElementById('indicatorFirstColumn');
        const secondColumn = document.getElementById('indicatorSecondColumn');
        const resultContent = document.getElementById('indicatorModalResultContent');
        const confirmBtn = document.getElementById('confirmIndicatorBtn');
        if (!indicatorSelect || !modalOverlay) return;

        function highlightCategory(category) {
            document.querySelectorAll('#indicatorFirstColumn .item').forEach(item => {
                item.classList.toggle('selected', item.textContent === category);
            });
        }

        function populateSecondColumn(category) {
            secondColumn.innerHTML = '';
            if (!category || !dataDict[category]) {
                secondColumn.innerHTML = '<div class="no-data">无数据</div>';
                return;
            }
            dataDict[category].forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.textContent = item;
                if (selectedIndicatorValues.has(item)) itemDiv.classList.add('selected');
                itemDiv.addEventListener('click', () => {
                    if (selectedIndicatorValues.has(item)) {
                        selectedIndicatorValues.delete(item);
                        itemDiv.classList.remove('selected');
                    } else {
                        selectedIndicatorValues.add(item);
                        itemDiv.classList.add('selected');
                    }
                    updateModalResult();
                });
                secondColumn.appendChild(itemDiv);
            });
            updateModalResult();
        }

        function populateFirstColumn() {
            firstColumn.innerHTML = '';
            Object.keys(dataDict).forEach(category => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.textContent = category;
                itemDiv.addEventListener('click', () => {
                    selectedIndicatorCategory = category;
                    highlightCategory(category);
                    populateSecondColumn(category);
                });
                firstColumn.appendChild(itemDiv);
            });
            const first = Object.keys(dataDict)[0];
            if (first) {
                selectedIndicatorCategory = first;
                highlightCategory(first);
                populateSecondColumn(first);
            }
        }

        function updateModalResult() {
            if (!resultContent) return;
            resultContent.textContent = selectedIndicatorValues.size === 0
                ? `已选择分类: ${selectedIndicatorCategory || ''}，请从右侧选择具体指标`
                : `已选择 (${selectedIndicatorValues.size}): ${Array.from(selectedIndicatorValues).join('、')}`;
        }

        indicatorSelect.addEventListener('change', function() {
            if (this.value === 'custom-selector') {
                modalOverlay.style.display = 'flex';
                populateFirstColumn();
                this.value = '';
            }
        });

        closeBtn?.addEventListener('click', () => { modalOverlay.style.display = 'none'; });
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.style.display = 'none';
        });

        confirmBtn?.addEventListener('click', () => {
            modalOverlay.style.display = 'none';
            renderSelectedIndicatorTags();
            performQuery();
        });
    }

    async function filterData(page = currentPage) {
        currentPage = page;
        const year = document.getElementById('yearSelect').value;
        const province = document.getElementById('provinceSelect').value;
        const city = document.getElementById('citySelect').value;
        const status = document.getElementById('statusFilter').value;
        const indicators = Array.from(selectedIndicatorValues).join(',');

        const params = new URLSearchParams({
            year: year || '',
            province: province || '',
            city: city || '',
            indicators: indicators || '',
            status: status || '',
            page: String(currentPage),
            page_size: String(pageSize),
        });

        const queryBtn = document.getElementById('queryBtn');
        const originalText = queryBtn.innerHTML;
        queryBtn.innerHTML = '<iconify-icon icon="mdi:loading" class="animate-spin"></iconify-icon> 查询中...';
        queryBtn.disabled = true;

        try {
            const res = await fetch(`/dashboard/api/check-data/?${params}`, { credentials: 'same-origin' });
            const data = await parseApiResponse(res, '指标校验');
            if (!data.success) throw new Error(data.message || '查询失败');

            filteredData = data.records || [];
            totalRecords = data.total || 0;
            totalPages = data.total_pages || 1;
            lastSummary = data.summary || null;
            lastGroupStats = data.group_stats || null;

            updateStatistics();
            updateGroupStats();
            renderTable();
            document.getElementById('tableInfo').textContent =
                data.years?.length ? `查询年份：${data.years.join('、')}` : '';
        } catch (error) {
            console.error('查询失败:', error);
            alert('查询失败：' + (error.message || '请稍后重试'));
            filteredData = [];
            renderTable();
        } finally {
            queryBtn.innerHTML = originalText;
            queryBtn.disabled = false;
        }
    }

    function updateStatistics() {
        const s = lastSummary || { total: 0, imported: 0, missing: 0, coverage_rate: 0 };
        document.getElementById('totalIndicators').innerText = s.total;
        document.getElementById('importedCount').innerText = s.imported;
        document.getElementById('missingCount').innerText = s.missing;
        document.getElementById('coverageRate').innerText = s.coverage_rate + '%';
    }

    function updateGroupStats() {
        const container = document.getElementById('groupStats');
        container.innerHTML = '';
        const stats = lastGroupStats || {};
        for (const [key, stat] of Object.entries(stats)) {
            if (!stat.total) continue;
            const rate = stat.rate ?? 0;
            const colorClass = rate >= 80 ? 'border-green-200 bg-green-50' : (rate >= 50 ? 'border-yellow-200 bg-yellow-50' : 'border-red-200 bg-red-50');
            const textColor = rate >= 80 ? 'text-green-700' : (rate >= 50 ? 'text-yellow-700' : 'text-red-700');
            container.innerHTML += `
                <div class="border ${colorClass} rounded-xl p-3 text-center">
                    <div class="text-xs text-slate-500">${stat.name}</div>
                    <div class="text-xl font-bold ${textColor}">${rate}%</div>
                    <div class="text-xs text-slate-400">${stat.imported}/${stat.total}</div>
                </div>
            `;
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const pageData = filteredData;

        if (pageData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-slate-400 py-12">暂无数据，请调整筛选条件</td></tr>';
            document.getElementById('paginationInfo').innerText = totalRecords
                ? `共 ${totalRecords} 条，当前第 ${currentPage}/${totalPages} 页`
                : '';
            document.getElementById('prevPage').disabled = true;
            document.getElementById('nextPage').disabled = true;
            return;
        }

        tbody.innerHTML = '';
        pageData.forEach(record => {
            const statusBadge = record.status === 'imported' 
                ? '<span class="status-badge status-imported"><iconify-icon icon="mdi:check-circle" width="14"></iconify-icon>已录入</span>'
                : '<span class="status-badge status-missing"><iconify-icon icon="mdi:close-circle" width="14"></iconify-icon>未录入</span>';
            
            const valueDisplay = record.value 
                ? `<span class="value-cell value-present font-medium">${parseFloat(record.value).toLocaleString()}</span>`
                : '<span class="value-cell value-absent">— 未录入 —</span>';
            
            const sourceDisplay = record.source_display || '—';
            const remarkDisplay = record.remark ? record.remark : '—';
            
            const row = document.createElement('tr');
            row.className = 'hover:bg-blue-50/30 transition-colors';
            row.innerHTML = `
                <td class="font-medium text-slate-800">${record.city}</td>
                <td class="text-slate-700">${record.indicator}</td>
                <td class="text-slate-600">${record.year}年</td>
                <td class="text-right">${valueDisplay}</td>
                <td class="text-slate-500 text-sm">${record.unit || '—'}</td>
                <td>${statusBadge}</td>
                <td class="text-slate-500 text-sm">${sourceDisplay}</td>
                <td class="text-slate-500 text-sm max-w-[150px] truncate" title="${remarkDisplay}">${remarkDisplay}</td>
            `;
            tbody.appendChild(row);
        });
        
        document.getElementById('paginationInfo').innerText =
            `第 ${currentPage} / ${totalPages || 1} 页，共 ${totalRecords} 条记录`;

        document.getElementById('prevPage').disabled = currentPage <= 1;
        document.getElementById('nextPage').disabled = currentPage >= totalPages;
    }
    
    // 导出CSV
    function exportToCSV() {
        if (filteredData.length === 0) {
            alert('暂无数据可导出');
            return;
        }
        const headers = ['城市', '指标名称', '年份', '录入数值', '单位', '录入状态', '数据来源', '备注'];
        const rows = filteredData.map(record => [
            record.city,
            record.indicator,
            record.year,
            record.value || '',
            record.unit || '',
            record.status === 'imported' ? '已录入' : '未录入',
            record.source_display || '',
            record.remark || ''
        ]);
        
        const csvContent = [headers, ...rows].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute('download', `指标核对数据_${new Date().toISOString().slice(0,19)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
    
    function performQuery() {
        filterData(1);
    }

    function bindEvents() {
        document.getElementById('provinceSelect').addEventListener('change', updateCitySelect);
        document.getElementById('queryBtn').addEventListener('click', performQuery);
        document.getElementById('exportBtn').addEventListener('click', exportToCSV);
        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) filterData(currentPage - 1);
        });
        document.getElementById('nextPage').addEventListener('click', () => {
            if (currentPage < totalPages) filterData(currentPage + 1);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        setupIndicatorModal();
        loadProvinceCityMap().then(async () => {
            await initYearSelect();
            initProvinceSelect();
            updateCitySelect();
            bindEvents();
            performQuery();
        }).catch(async (error) => {
            console.error('加载省份城市数据失败:', error);
            provinceCityMap = {
                "北京市": ["北京市"], "天津市": ["天津市"], "上海市": ["上海市"], "重庆市": ["重庆市"],
                "江苏省": ["南京市", "苏州市"], "浙江省": ["杭州市"], "广东省": ["广州市", "深圳市"]
            };
            await initYearSelect();
            initProvinceSelect();
            updateCitySelect();
            bindEvents();
            performQuery();
        });
    });



</script>
