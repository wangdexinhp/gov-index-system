<script>
    // Excel上传表单：自动同步年份字段，并校验必须选择年份，AJAX提交只弹提示不跳转
    document.addEventListener('DOMContentLoaded', function() {
      var yearSelect = document.getElementById('year-select');
      var excelYearInput = document.getElementById('excel-upload-year');
      var excelForm = document.getElementById('excel-upload-form');
      if (yearSelect && excelYearInput) {
        var setYear = function() {
          var val = yearSelect.value || '';
          var year = val.replace(/[^\d]/g, '');
          excelYearInput.value = year;
        };
        setYear();
        yearSelect.addEventListener('change', setYear);
      }
      if (excelForm) {
        excelForm.addEventListener('submit', function(e) {
          if (excelYearInput && (!excelYearInput.value || excelYearInput.value === '')) {
            e.preventDefault();
            alert('请先选择年份再上传Excel！');
            return false;
          }
          e.preventDefault();
          var formData = new FormData(excelForm);
          var submitBtn = excelForm.querySelector('button[type="submit"]');
          var originalText = submitBtn ? submitBtn.textContent : '';
          if (submitBtn) {
            submitBtn.textContent = '上传中...';
            submitBtn.disabled = true;
          }
          fetch(excelForm.action, {
            method: 'POST',
            body: formData
          })
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              showAutoCloseMessage('✅ Excel上传成功！', 'success');
              // 不跳转
            } else {
              showAutoCloseMessage('❌ 上传失败：' + (data.message || '未知错误'), 'error');
            }
            if (submitBtn) {
              submitBtn.textContent = originalText;
              submitBtn.disabled = false;
            }
          })
          .catch(error => {
            showAutoCloseMessage('❌ 网络错误', 'error');
            if (submitBtn) {
              submitBtn.textContent = originalText;
              submitBtn.disabled = false;
            }
          });
        });
      }
    });

function initYearSelector(selectId = 'year-select') {
    const select = document.getElementById(selectId);
    if (!select) return;
    
    const currentYear = new Date().getFullYear();
    
    // 清空现有选项（除了第一个提示项）
    while (select.options.length > 1) {
        select.remove(1);
    }
    
    // 生成从今年开始往回20年
    for (let i = 0; i <= 20; i++) {
        const year = currentYear - i;
        const option = new Option(year + '年', year);
        select.add(option);
    }
    
    // 默认选择今年
    // select.value = currentYear;
    select.selectedIndex = 0;
    
    return select;
}


document.addEventListener('DOMContentLoaded', function() {
    initYearSelector();
});



    // 计算总指标数和更新进度的函数
      function updateProgress() {
      // 只统计“数值”和“备注”字段（通过 placeholder 选择，避免把“去年参考”计入）
      const allInputs = document.querySelectorAll('#manual-section table tbody input[placeholder="数值"]');
      const totalIndicators = allInputs.length;

      // 统计有值的输入框
      let completedIndicators = 0;
      allInputs.forEach(input => {
        if (input.value.trim() !== '') {
          completedIndicators++;
        }
      });
      
      // 更新进度文本和进度条
      const progressText = document.getElementById('progress-text');
      const progressBar = document.getElementById('progress-bar');
      
      if (totalIndicators > 0) {
        const percentage = (completedIndicators / totalIndicators) * 100;
        progressText.textContent = `进度：已完成${completedIndicators}/${totalIndicators}指标`;
        progressBar.style.width = percentage + '%';
      }
    }

    // 为所有输入框添加事件监听
    function attachProgressListeners() {
      // 仅为“数值”和“备注”字段添加监听
      const inputs = document.querySelectorAll('#manual-section table tbody input[placeholder="数值"], #manual-section table tbody input[placeholder="备注"]');
      inputs.forEach(input => {
        input.addEventListener('input', updateProgress);
        input.addEventListener('change', updateProgress);
      });
    }

    // 页面加载时初始化进度
    document.addEventListener('DOMContentLoaded', function() {
      updateProgress();
      attachProgressListeners();
    });

    // 省份->城市联动：前端渲染城市列表并根据省份过滤（不依赖后端）
    (function() {
      let provinceCityMap = {};

      // 全局已选城市集合 - 跨省保持选择
      const globalSelectedCities = new Set();

      function renderCitiesForProvince(prov) {
        const container = document.getElementById('city-items');
        const empty = document.getElementById('city-empty');
        
        container.innerHTML = '';
        // 根据选择的省份过滤城市
        const cities = prov && prov !== '' ? (provinceCityMap[prov] || []) : Object.values(provinceCityMap).flat();
        if (!cities || cities.length === 0) {
          empty.classList.remove('hidden');
          return;
        }
        empty.classList.add('hidden');
        cities.forEach(city => {
          const id = 'city-' + city.replace(/\s|市/g, '');
          const div = document.createElement('div');
          div.className = 'flex items-center';
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.className = 'rounded border-gray-600 text-yellow-500 city-checkbox';
          input.value = city;
          input.id = id;
          // 根据全局集合恢复勾选状态
          input.checked = globalSelectedCities.has(city);
          const label = document.createElement('label');
          label.htmlFor = id;
          label.className = 'ml-2 text-black text-sm';
          label.textContent = city;
          div.appendChild(input);
          div.appendChild(label);
          container.appendChild(div);
        });
      }

      function getSelectedCities() {
        // 返回全局已选城市集合中的城市
        return Array.from(globalSelectedCities);
      }

      function renderTableRows() {

        const tbodySelector = document.querySelector('#manual-section table tbody');
        if (!tbodySelector) return;
        const tbody = tbodySelector;
        tbody.innerHTML = '';
        const cities = getSelectedCities();

        // calculate current number of indicator groups from header
        const headers = document.querySelectorAll('#manual-section table thead th[data-indicator]');
        const groups = headers ? headers.length : 0;

        // 调试输出

      // Build table headers dynamically given an array of indicator names
      function buildTableHeaders(indicators) {
        const thead = document.querySelector('#manual-section table thead');
        if (!thead) return;
        const firstRow = thead.querySelector('tr:first-child');
        const secondRow = thead.querySelector('tr:nth-child(2)');

        // first row: city + indicator ths (colspan=4)
        firstRow.innerHTML = '';
        const thCity = document.createElement('th');
        thCity.className = 'border border-gray-600 px-4 py-3 text-left text-yellow-500 font-medium min-w-24';
        thCity.textContent = '城市';
        firstRow.appendChild(thCity);

        indicators.forEach(ind => {
          const th = document.createElement('th');
          th.className = 'border border-gray-600 px-4 py-3 text-left text-yellow-500 font-medium';
          th.colSpan = 4;
          th.setAttribute('data-indicator', ind);
          th.textContent = ind;
          firstRow.appendChild(th);
        });

        // second row: blank + 4 sub-headers per indicator
        secondRow.innerHTML = '';
        const thEmpty = document.createElement('th');
        thEmpty.className = 'border border-gray-600 px-2 py-2 text-left text-gray-300 font-normal text-xs min-w-20';
        secondRow.appendChild(thEmpty);
        indicators.forEach(() => {
          ['数值', '备注', '数据来源', '去年参考'].forEach(title => {
            const th = document.createElement('th');
            th.className = 'border border-gray-600 px-2 py-2 text-left text-black font-normal text-xs min-w-20';
            th.textContent = title;
            secondRow.appendChild(th);
          });
        });
      }

      // expose functions so outside code (indicator filter) can rebuild headers
      window.buildTableHeaders = buildTableHeaders;
      window.renderTableRows = renderTableRows;

            const rows = (function collectRowsData() {
              const out = [];
              const tbody = document.querySelector('#manual-section table tbody');
              if (!tbody) return out;
              // 获取年份和省份
              const yearSel = document.querySelector('select');
              let year = '';
              if (yearSel) {
                const ytxt = yearSel.value || yearSel.options[yearSel.selectedIndex]?.text || '';
                year = ytxt.replace(/[^\d]/g, '');
              }
              const provSel = document.getElementById('province-select');
              const province = provSel ? provSel.value : '';
              // 获取所有指标中文名
              const headerEls = document.querySelectorAll('#manual-section table thead th[data-indicator]');
              const indicatorNames = Array.from(headerEls).map(h => h.getAttribute('data-indicator'));
              tbody.querySelectorAll('tr').forEach(tr => {
                const cityCell = tr.children[0];
                if (!cityCell) return;
                const city = cityCell.textContent.trim();
                if (!city || city === '未找到要录入的城市') return;
                let cursor = 1;
                const groups = [];
                for (let g = 0; g < indicatorNames.length; g++) {
                  const valTd = tr.children[cursor];
                  const noteTd = tr.children[cursor+1];
                  const sourceTd = tr.children[cursor+2];
                  const val = valTd ? (valTd.querySelector('input') ? valTd.querySelector('input').value.trim() : '') : '';
                  const note = noteTd ? (noteTd.querySelector('input') ? noteTd.querySelector('input').value.trim() : '') : '';
                  const source = sourceTd ? (sourceTd.querySelector('select') ? sourceTd.querySelector('select').value : '') : '';
                  const refTd = tr.children[cursor+3];
                  const reference = refTd ? (refTd.querySelector('input') ? refTd.querySelector('input').value.trim() : (refTd.textContent || '').trim()) : '';
                  const name_zh = indicatorNames[g] || '';
                  groups.push({ value: val, note: note, source: source, reference: reference, name_zh: name_zh });
                  cursor += 4;
                }
                out.push({ city: city, province: province, year: year, groups: groups });
              });
              return out;
            })();

            if (!rows || rows.length === 0) {
              e.preventDefault();
              alert('请先选择一个或多个城市，再提交数据。');
              return false;
            }

            const hidden = document.getElementById('rows-json');

            // allow form to submit normally
            e.preventDefault();
            // 获取表单数据
            const formData = new FormData(this);
            
            // 显示加载状态
            const submitBtn = document.getElementById('submit-button');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '提交中...';
            submitBtn.disabled = true;

            fetch(this.action, {

            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {

                    alert('❌ 提交失败：' + data.message);
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                console.error('错误:', error);
                alert('❌ 网络错误');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            });

function showAutoCloseMessage(message, type = 'success') {
    // 移除已有的消息
    const existingMsg = document.querySelector('.auto-close-message');
    if (existingMsg) existingMsg.remove();
    
    // 创建消息元素
    const msgDiv = document.createElement('div');
    msgDiv.className = 'auto-close-message fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-4 rounded-lg shadow-lg z-50';
    
    // 根据类型设置样式
    if (type === 'success') {
        msgDiv.className += ' bg-green-600 text-white border-l-4 border-green-400';
    } else {
        msgDiv.className += ' bg-red-600 text-white border-l-4 border-red-400';
    }
    
    // 添加图标和消息
    msgDiv.innerHTML = `
        <div class="flex items-center">
            <iconify-icon icon="${type === 'success' ? 'mdi:check-circle' : 'mdi:alert-circle'}" 
                class="text-2xl mr-3"></iconify-icon>
            <span class="text-lg font-medium">${message}</span>
        </div>
    `;
    
    // 初始状态：隐藏在上方
    msgDiv.style.opacity = '0';
    msgDiv.style.transform = 'translateX(-50%) translateY(-30px)';
    msgDiv.style.transition = 'all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55)';
    
    // 添加到页面
    document.body.appendChild(msgDiv);
    
    // 触发入场动画
    setTimeout(() => {
        msgDiv.style.opacity = '1';
        msgDiv.style.transform = 'translateX(-50%) translateY(0)';
    }, 10);
    
    // 3秒后开始消失动画
    setTimeout(() => {
        // 离场动画
        msgDiv.style.opacity = '0';
        msgDiv.style.transform = 'translateX(-50%) translateY(-20px) scale(0.95)';
        
        // 动画完成后移除元素
        setTimeout(() => {
            if (msgDiv.parentNode) {
                msgDiv.parentNode.removeChild(msgDiv);
            }
        }, 400); // 与transition时间匹配
    }, 3000); // 总共显示3秒（入场+停留）
}

    // Populate subfilter options when a category (指标组) is chosen.
    function populateSubfilter(categoryKey) {
      const content = document.getElementById('indicator-content');
      if (!content) return;
      content.innerHTML = '';
      if (!categoryKey || categoryKey === '') {
        // leave empty so user can choose nothing
        return;
      }
      const items = indicatorCategories[categoryKey] || [];

      // control buttons: 全选 / 取消全选
      const ctrlDiv = document.createElement('div');
      ctrlDiv.className = 'flex justify-end mb-2 space-x-2';
      const btnAll = document.createElement('button');
      btnAll.type = 'button';
      btnAll.className = 'text-xs text-black hover:text-black';
      btnAll.textContent = '全选';
      const btnNone = document.createElement('button');
      btnNone.type = 'button';
      btnNone.className = 'text-xs text-black hover:text-black';
      btnNone.textContent = '取消全选';
  ctrlDiv.appendChild(btnAll);
  ctrlDiv.appendChild(btnNone);
      content.appendChild(ctrlDiv);

  const listDiv = document.createElement('div');
  // ensure a single vertical column (no auto-wrapping into multiple columns)
  listDiv.className = 'flex flex-col space-y-2';

      items.forEach((i, idx) => {
        const label = ('' + i).replace(/^#/, '');
        const id = 'indicator-' + categoryKey + '-' + idx;
  const row = document.createElement('div');
  // full width row so items never wrap into multiple horizontal columns
  row.className = 'flex items-center w-full';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.className = 'indicator-checkbox rounded border-gray-600 text-yellow-500';
        input.value = label;
        input.id = id;
  const lab = document.createElement('label');
  lab.htmlFor = id;
  // prevent label text from wrapping; truncate with ellipsis if too long
  lab.className = 'ml-2 text-black text-sm truncate';
  lab.textContent = label;
  lab.title = label;
        row.appendChild(input);
        row.appendChild(lab);
        listDiv.appendChild(row);
      });

      content.appendChild(listDiv);

      // attach control actions
      btnAll.addEventListener('click', function() {
        const globalList = window.globalSelectedIndicators || [];
        content.querySelectorAll('.indicator-checkbox').forEach(cb => {
          cb.checked = true;
          if (!globalList.includes(cb.value)) {
            globalList.push(cb.value);
          }
        });
        window.globalSelectedIndicators = globalList;
        if (window.buildTableHeaders) window.buildTableHeaders(globalList);
        if (window.renderTableRows) window.renderTableRows();
      });
      btnNone.addEventListener('click', function() {
        const globalList = window.globalSelectedIndicators || [];
        const currentValues = Array.from(content.querySelectorAll('.indicator-checkbox')).map(cb => cb.value);
        content.querySelectorAll('.indicator-checkbox').forEach(cb => cb.checked = false);
        window.globalSelectedIndicators = globalList.filter(val => !currentValues.includes(val));
        if (window.buildTableHeaders) window.buildTableHeaders(window.globalSelectedIndicators);
        if (window.renderTableRows) window.renderTableRows();
      });
    }

    // Initialize global selected indicators across all categories
    window.globalSelectedIndicators = window.globalSelectedIndicators || [];
    
    indicatorFilter.addEventListener('change', function() {
      const selectedCategory = this.value;
      const content = document.getElementById('indicator-content');
      if (!content) return;
      
      if (selectedCategory === '') {
        // restore initial headers and clear subfilter, but don't touch the table rows
        content.innerHTML = '';
        return;
      }

      // Fill the secondary panel with new category items - DO NOT rebuild the table
      populateSubfilter(selectedCategory);
      
      // Mark checkboxes that match indicators already in the global selected list
      const newCheckboxes = Array.from(content.querySelectorAll('.indicator-checkbox'));
      newCheckboxes.forEach(checkbox => {
        checkbox.checked = window.globalSelectedIndicators.includes(checkbox.value);
      });
      
      // Auto-open the indicator subfilter when category is selected
      const toggleIcon = document.getElementById('indicator-toggle-icon');
      const subfilter = document.getElementById('indicator-subfilter');
      const placeholder = document.getElementById('indicator-placeholder');
      if (placeholder && content && subfilter && toggleIcon) {
        placeholder.classList.add('hidden');
        content.classList.remove('hidden');
        subfilter.style.height = '200px';
        subfilter.style.overflowY = 'auto';
        subfilter.style.cursor = 'default';
        toggleIcon.setAttribute('icon', 'mdi:chevron-down');
        window.indicatorPanelExpanded = true;
      }
      // DO NOT call buildTableHeaders or renderTableRows here - only update the checkbox panel
    });

    // Initialize global selected indicators across all categories
    window.globalSelectedIndicators = window.globalSelectedIndicators || [];
    
    // Delegate change events: handle indicator-checkbox changes to rebuild headers
    document.addEventListener('change', function(e) {
      if (e.target && e.target.classList && e.target.classList.contains('indicator-checkbox')) {
        const checkboxValue = e.target.value;
        
        // Update global list based on checkbox state
        if (e.target.checked) {
          // Add to global list if not already there
          if (!window.globalSelectedIndicators.includes(checkboxValue)) {
            window.globalSelectedIndicators.push(checkboxValue);
          }
        } else {
          // Remove from global list
          const idx = window.globalSelectedIndicators.indexOf(checkboxValue);
          if (idx > -1) {
            window.globalSelectedIndicators.splice(idx, 1);
          }
        }
        
        // Rebuild table with all globally selected indicators (from all categories)
        if (!window.globalSelectedIndicators || window.globalSelectedIndicators.length === 0) {
          if (window.buildTableHeaders) window.buildTableHeaders([]);
          if (window.renderTableRows) window.renderTableRows();
          return;
        }
        if (window.buildTableHeaders) window.buildTableHeaders(window.globalSelectedIndicators);
        if (window.renderTableRows) window.renderTableRows();
      }
    });

    // Default: select 'admin' group and populate subfilter, but keep it closed initially
    (function setDefaultIndicatorGroup() {
      const defaultGroup = 'admin';
      if (indicatorFilter) indicatorFilter.value = defaultGroup;
      // populate checkboxes but keep panel closed
      populateSubfilter(defaultGroup);
      // leave headers empty until user explicitly checks indicators
      if (window.buildTableHeaders) window.buildTableHeaders([]);
      if (window.renderTableRows) window.renderTableRows();
      window.indicatorPanelExpanded = false;
      // keep placeholder visible initially
      const placeholder = document.getElementById('indicator-placeholder');
      const content = document.getElementById('indicator-content');
      if (placeholder && content) {
        placeholder.classList.remove('hidden');
        content.classList.add('hidden');
      }
    })();

    // Toggle indicator subfilter panel on label click
    (function setupIndicatorToggle() {
      const label = document.getElementById('indicator-label');
      const subfilter = document.getElementById('indicator-subfilter');
      const toggleIcon = document.getElementById('indicator-toggle-icon');
      const placeholder = document.getElementById('indicator-placeholder');
      const content = document.getElementById('indicator-content');
      
      function toggleIndicatorPanel(e) {
        e.preventDefault();
        e.stopPropagation();
        window.indicatorPanelExpanded = !window.indicatorPanelExpanded;
        if (window.indicatorPanelExpanded) {
          placeholder.classList.add('hidden');
          content.classList.remove('hidden');
          subfilter.style.height = '200px';
          subfilter.style.overflowY = 'auto';
          subfilter.style.cursor = 'default';
          toggleIcon.setAttribute('icon', 'mdi:chevron-down');
        } else {
          placeholder.classList.remove('hidden');
          content.classList.add('hidden');
          subfilter.style.height = '52px';
          subfilter.style.overflowY = 'hidden';
          subfilter.style.cursor = 'pointer';
          toggleIcon.setAttribute('icon', 'mdi:chevron-right');
        }
      }
      
      if (label && subfilter) {
        label.addEventListener('click', toggleIndicatorPanel);
        subfilter.addEventListener('click', function(e) {
          // 只有在未展开状态下才响应点击
          if (!window.indicatorPanelExpanded) {
            toggleIndicatorPanel(e);
          }
        });
      }
    })();

    // Toggle city list panel on label or placeholder click
    (function setupCityToggle() {
      const label = document.getElementById('city-label');
      const cityList = document.getElementById('city-list');
      const toggleIcon = document.getElementById('city-toggle-icon');
      const placeholder = document.getElementById('city-placeholder');
      const content = document.getElementById('city-content');
      
      function toggleCityPanel(e) {
        e.preventDefault();
        e.stopPropagation();
        window.cityPanelExpanded = !window.cityPanelExpanded;
        if (window.cityPanelExpanded) {
          placeholder.classList.add('hidden');
          content.classList.remove('hidden');
          cityList.style.height = '200px';
          cityList.style.overflowY = 'auto';
          cityList.style.cursor = 'default';
          toggleIcon.setAttribute('icon', 'mdi:chevron-down');
        } else {
          placeholder.classList.remove('hidden');
          content.classList.add('hidden');
          cityList.style.height = '52px';
          cityList.style.overflowY = 'hidden';
          cityList.style.cursor = 'pointer';
          toggleIcon.setAttribute('icon', 'mdi:chevron-right');
        }
      }
      
      if (label && cityList) {
        label.addEventListener('click', toggleCityPanel);
        cityList.addEventListener('click', function(e) {
          // 只有在未展开状态下才响应点击
          if (!window.cityPanelExpanded) {
            toggleCityPanel(e);
          }
        });
      }
    })();
  </script>
