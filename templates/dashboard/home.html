<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>数据指标管理系统 | 蓝色商务版</title>
<script src="/static/js/tailwindcss.js"></script>
<script src="/static/js/indicator_source_input.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/iconify/3.1.1/iconify.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
    body {
        background: #f0f4f9;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 关键修复：表格容器支持横向滚动，表格宽度不压缩 */
    .table-wrapper {
        overflow-x: auto;
        overflow-y: auto;
        max-height: 60vh;
        width: 100%;
    }
    
    /* 表格固定最小宽度，防止指标过多时被压缩 */
    .data-table {
        min-width: 800px;
        width: max-content;
        border-collapse: collapse;
    }
    
    /* 固定第一列（城市列）在横向滚动时保持可见 */
    .data-table th:first-child,
    .data-table td:first-child {
        position: sticky;
        left: 0;
        background: #ffffff;
        z-index: 10;
        box-shadow: 4px 0 8px -4px rgba(0, 80, 120, 0.15);
    }
    
    .data-table thead th:first-child {
        z-index: 11;
        background: #f0f9ff;
    }
    
    /* 每个指标组固定宽度，不再被挤压 */
    .data-table th,
    .data-table td {
        border: 1px solid #bfdbfe;
        padding: 8px 12px;
        vertical-align: top;
    }
    
    /* 指标头部（指标名称）固定宽度 */
    .data-table th[data-indicator] {
        min-width: 160px;
        max-width: 200px;
        white-space: normal;
        word-break: break-word;
    }
    
    /* 数值、备注等子列固定宽度 */
    .data-table th:not(:first-child),
    .data-table td:not(:first-child) {
        min-width: 120px;
        width: 120px;
    }
    .data-table td.source-cell,
    .data-table th.source-cell {
        min-width: 176px;
        width: 176px;
    }
    .source-input-wrap {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 3px;
        width: 100%;
    }
    .source-place-label {
        flex-shrink: 0;
        display: inline-block;
        padding: 2px 3px;
        font-size: 10px;
        line-height: 1.3;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
        background: #f1f5f9;
        color: #475569;
        text-align: center;
        max-width: 2.4rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: top;
    }
    .source-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .source-main .source-type-select,
    .source-main .source-detail-input {
        width: 100%;
        padding: 3px 5px;
        font-size: 11px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
    }
    
    /* 输入框在单元格内自适应宽度 */
    .data-table input,
    .data-table select {
        width: 100%;
        min-width: 100px;
        box-sizing: border-box;
    }
    
    /* 滚动条样式 */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: #e2e8f0;
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 10px;
    }
    
    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #3b82f6 !important;
        box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
    }
    
    #city-list, #indicator-subfilter {
        transition: all 0.3s ease;
        cursor: pointer;
    }
    #city-items {
        max-height: 140px;
        overflow-y: auto;
        padding-right: 4px;
    }
    .city-checkbox, .indicator-checkbox {
        cursor: pointer;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
    }
    .city-checkbox:checked, .indicator-checkbox:checked {
        background-color: #3b82f6;
        border-color: #3b82f6;
    }
    #city-content .flex.items-center {
        padding: 6px 0;
        transition: background 0.1s;
    }
    #city-content .flex.items-center:hover {
        background-color: #f0f7ff;
    }
</style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen font-sans antialiased">

<header class="bg-white border-b border-blue-200 shadow-sm h-20 flex items-center px-8 sticky top-0 z-50 backdrop-blur-sm bg-white/95">
<div class="flex items-center space-x-3">
    <div class="bg-blue-600 rounded-xl p-2 shadow-md">
        <iconify-icon class="text-white text-2xl" icon="mdi:chart-line"></iconify-icon>
    </div>
    <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-700 to-cyan-600 bg-clip-text text-transparent">数据指标管理系统</h1>
</div>



<div class="ml-auto flex items-center space-x-4">

    <div class="flex space-x-3 mr-6">
        <a href="/dashboard/" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm shadow-sm transition-all">

        <a href="/dashboard/single-indicator-year-query/" class="text-slate-700 hover:text-blue-700 font-medium py-2 px-4 rounded-lg text-sm border border-slate-300 hover:border-blue-400 transition">

        </a>
        <a href="/dashboard/single-indicator-city-query/" class="text-slate-700 hover:text-blue-700 font-medium py-2 px-4 rounded-lg text-sm border border-slate-300 hover:border-blue-400 transition">
            单指标多城市查询

    </div>
</div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">

    <div class="flex items-center space-x-3 mb-6">
        <div class="bg-blue-100 p-2 rounded-xl">
            <iconify-icon class="text-blue-600 text-2xl" icon="fluent:database-search-24-filled"></iconify-icon>
        </div>
        <div class="flex space-x-3">
            <a href="/dashboard/" class="bg-blue-600 text-white font-medium py-2 px-5 rounded-xl shadow-sm hover:bg-blue-700 transition">地市指标录入</a>
            <a href="/dashboard/area_input" class="bg-white border border-slate-300 text-slate-700 font-medium py-2 px-5 rounded-xl hover:bg-slate-50 transition">区县指标录入</a>
            <a href="/dashboard/indicator-check" class="bg-white border border-slate-300 text-slate-700 font-medium py-2 px-5 rounded-xl hover:bg-slate-50 transition">指标校验</a>
        </div>
    </div>


    <!-- 筛选卡片 -->
    <div class="bg-white border border-blue-200 rounded-2xl shadow-md p-6 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-6 gap-6">
            <div>
                <label class="block text-sm font-semibold text-blue-700 mb-2">📅 选择年份</label>
                <select id="year-select" class="w-full bg-white border border-slate-300 rounded-xl py-3 px-4 text-slate-700 focus:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none">

                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-blue-700 mb-2">📍 选择省份</label>
                <select id="province-select" class="w-full bg-white border border-slate-300 rounded-xl py-3 px-4 text-slate-700 focus:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none">
                    <option value="">请选择省份</option>
                    <option value="北京市">北京市</option><option value="天津市">天津市</option><option value="上海市">上海市</option>
                    <option value="重庆市">重庆市</option><option value="河北省">河北省</option><option value="山西省">山西省</option>
                    <option value="辽宁省">辽宁省</option><option value="吉林省">吉林省</option><option value="黑龙江省">黑龙江省</option>
                    <option value="江苏省">江苏省</option><option value="浙江省">浙江省</option><option value="安徽省">安徽省</option>
                    <option value="福建省">福建省</option><option value="江西省">江西省</option><option value="山东省">山东省</option>
                    <option value="河南省">河南省</option><option value="湖北省">湖北省</option><option value="湖南省">湖南省</option>
                    <option value="广东省">广东省</option><option value="海南省">海南省</option><option value="四川省">四川省</option>
                    <option value="贵州省">贵州省</option><option value="云南省">云南省</option><option value="陕西省">陕西省</option>
                    <option value="甘肃省">甘肃省</option><option value="青海省">青海省</option><option value="内蒙古自治区">内蒙古自治区</option>
                    <option value="广西壮族自治区">广西壮族自治区</option><option value="西藏自治区">西藏自治区</option>
                    <option value="宁夏回族自治区">宁夏回族自治区</option><option value="新疆维吾尔自治区">新疆维吾尔自治区</option>
                </select>
            </div>
            <div class="min-w-0">
                <label id="city-label" class="block text-sm font-semibold text-blue-700 mb-2 cursor-pointer flex items-center">
                    <iconify-icon id="city-toggle-icon" class="text-blue-500 text-lg mr-2 transition-transform" icon="mdi:chevron-right"></iconify-icon>
                    <span>🏙️ 选择城市 (多选)</span>
                </label>
                <div id="city-list" class="bg-white border border-slate-300 rounded-xl py-3 px-4 overflow-hidden transition-all duration-300 cursor-pointer shadow-sm" style="height: 52px;">
                    <div id="city-placeholder" class="text-slate-500 text-base text-center">请选择城市</div>
                    <div id="city-content" class="hidden">
                        <div class="flex justify-end mb-2 space-x-3">
                            <button type="button" id="select-all-cities" class="text-xs text-blue-600 hover:text-blue-800 font-medium">全选</button>
                            <button type="button" id="deselect-all-cities" class="text-xs text-slate-500 hover:text-slate-700">取消全选</button>
                        </div>
                        <div class="space-y-1" id="city-items"></div>
                        <div id="city-empty" class="text-gray-400 text-sm p-2 hidden">暂无城市数据，请先选择省份</div>
                    </div>
                </div>
            </div>
            <div class="min-w-0 overflow-hidden">
                <label class="block text-sm font-semibold text-blue-700 mb-2">📊 指标组</label>
                <select id="indicator-filter" class="w-full bg-white border border-slate-300 rounded-xl py-3 px-4 text-slate-700 focus:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none">
                    <option value="admin" selected>行政区域数据</option>
                    <option value="population">人口数据</option><option value="economy_structure">经济结构数据</option>
                    <option value="education_tech">教育科技数据</option><option value="employment">就业数据</option>
                    <option value="finance">财政指标数据</option><option value="economic_performance">经济效果数据</option>
                    <option value="ecology">生态环保数据</option><option value="market_supervision">市场监管数据</option>
                    <option value="social_security">社会保障数据</option><option value="healthcare">医疗卫生数据</option>
                    <option value="infrastructure">基础设施数据</option><option value="public_safety">公共安全数据</option>
                    <option value="culture_sports">文化体育数据</option><option value="administrative_integrity">行政廉洁数据</option>
                    <option value="economic_growth">经济增长数据</option><option value="economic_development">经济发展数据</option>
                    <option value="public_service">公共服务数据</option><option value="law_based_governance">依法行政数据</option>
                    <option value="government_affairs_openness">政务公开数据</option>
                </select>
            </div>
            <div class="min-w-0 overflow-hidden">
                <label id="indicator-label" class="block text-sm font-semibold text-blue-700 mb-2 cursor-pointer flex items-center">
                    <iconify-icon id="indicator-toggle-icon" class="text-blue-500 text-lg mr-2" icon="mdi:chevron-right"></iconify-icon>
                    <span>🔍 筛选指标（多选）</span>
                </label>
                <div id="indicator-subfilter" class="w-full bg-white border border-slate-300 rounded-xl py-3 px-4 overflow-hidden transition-all duration-300 cursor-pointer shadow-sm" style="height: 52px;">

                    <div id="indicator-content" class="hidden"></div>

            </div>
        </div>
    </div>

    <div class="mb-6 border-b border-blue-200">
        <div class="flex space-x-6">
            <button class="pb-3 px-1 font-semibold text-blue-700 border-b-2 border-blue-600 transition" id="manual-tab">✍️ 手工录入</button>
            <button class="pb-3 px-1 font-medium text-slate-600 hover:text-blue-600 transition" id="excel-tab">📎 Excel上传</button>
        </div>
    </div>

    <form id="manual-form" method="post" action="/dashboard/submit/">
        {% csrf_token %}
        <div class="bg-white border border-blue-200 rounded-2xl shadow-md p-6 mb-8" id="manual-section">
            <!-- 关键修改：添加 table-wrapper 容器支持横向滚动 -->
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr class="bg-gradient-to-r from-blue-50 to-white sticky top-0 z-10">
                            <th class="border border-blue-200 px-4 py-3 text-left text-blue-700 font-semibold min-w-24 bg-white">城市</th>
                        </tr>
                        <tr class="bg-gray-50 sticky top-12 z-10">
                            <th class="border border-blue-200 px-2 py-2 text-left text-slate-500 font-medium text-xs min-w-20 bg-gray-50"></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <input type="hidden" id="rows-json" name="rows_json" value="" />
            <div class="flex space-x-4 mt-6">
                <button id="submit-button" type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-xl shadow-md transition-all">💾 提交数据</button>
                <button id="reset-button" type="button" class="bg-white border border-slate-300 text-slate-700 font-medium py-3 px-8 rounded-xl hover:bg-slate-50 transition">🔄 重置表单</button>
                <button id="save-draft-button" type="button" class="ml-auto bg-slate-100 border border-slate-300 text-slate-700 font-medium py-3 px-6 rounded-xl flex items-center gap-2 hover:bg-slate-200 transition">
                    <iconify-icon icon="mdi:content-save"></iconify-icon> 保存草稿
                </button>
            </div>
        </div>
    </form>

    <form id="excel-upload-form" action="/dashboard/upload_excel/" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="hidden" name="year" id="excel-upload-year" value="" />
        <div class="bg-white border border-blue-200 rounded-2xl shadow-md p-6 mb-8 hidden" id="excel-section">
            <div class="text-center py-8">
                <div class="mx-auto w-20 h-20 flex items-center justify-center bg-blue-100 rounded-full mb-6 shadow-inner">
                    <iconify-icon class="text-blue-600 text-4xl" icon="mdi:file-excel"></iconify-icon>
                </div>
                <h3 class="text-xl font-bold text-slate-800 mb-3">上传Excel数据文件</h3>
                <p class="text-slate-500 mb-8">支持 .xlsx 格式，请确保数据格式符合模板要求。数据单元格底色将自动识别来源（见模板「颜色标示区」）。</p>
                <div class="border-2 border-dashed border-blue-300 rounded-xl max-w-xl mx-auto p-8 bg-blue-50/40">
                    <div class="flex flex-col items-center gap-4">
                        <iconify-icon class="text-blue-500 text-4xl" icon="mdi:cloud-upload"></iconify-icon>
                        <input type="file" name="excel_file" accept=".xlsx,.xls" required class="text-sm text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-8 rounded-xl shadow transition">上传并解析</button>
                    </div>
                </div>
                <div class="mt-8">
                    <button type="button" class="flex items-center text-blue-600 hover:text-blue-800 mx-auto gap-1 font-medium">
                        <iconify-icon icon="mdi:download"></iconify-icon> 下载Excel模板
                    </button>
                </div>
            </div>
        </div>
    </form>

    <div class="bg-gradient-to-r from-blue-50 to-white border border-blue-200 rounded-2xl shadow-sm p-4 mb-8">
        <div class="flex items-center justify-between flex-wrap gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-100 p-2 rounded-full">
                    <iconify-icon class="text-blue-600 text-xl" icon="mdi:progress-clock"></iconify-icon>
                </div>
                <div>
                    <p class="text-sm text-slate-500">数据录入进度</p>
                    <p class="text-lg font-bold text-blue-700" id="progress-text">进度：已完成0/0指标</p>
                </div>
            </div>
            <div class="w-64 h-3 bg-slate-200 rounded-full overflow-hidden shadow-inner">
                <div class="h-full bg-gradient-to-r from-blue-500 to-cyan-500 rounded-full transition-all duration-300" id="progress-bar" style="width: 0%"></div>
            </div>
        </div>
    </div>
</main>

<script>
    function initYearSelector() {
        const select = document.getElementById('year-select');
        if (!select) return;
        const currentYear = new Date().getFullYear();
        while (select.options.length > 1) select.remove(1);
        for (let i = 0; i <= 20; i++) {
            const year = currentYear - i;
            const option = new Option(year + '年', year);
            select.add(option);
        }
        select.selectedIndex = 0;
    }
    initYearSelector();

    function updateProgress() {
        const allInputs = document.querySelectorAll('#manual-section .data-table tbody input[placeholder="数值"]');
        const total = allInputs.length;
        let completed = 0;
        allInputs.forEach(inp => { if (inp.value.trim() !== '') completed++; });
        const percent = total ? (completed / total) * 100 : 0;
        document.getElementById('progress-text').innerText = `进度：已完成${completed}/${total}指标`;
        document.getElementById('progress-bar').style.width = percent + '%';
    }
    
    function attachProgressListeners() {
        const inputs = document.querySelectorAll('#manual-section .data-table tbody input[placeholder="数值"], #manual-section .data-table tbody input[placeholder="备注"]');
        inputs.forEach(inp => {
            inp.removeEventListener('input', updateProgress);
            inp.addEventListener('input', updateProgress);
            inp.addEventListener('change', updateProgress);
        });
    }

    const DEFAULT_FORM_SOURCE_OPTIONS = [
        { code: 'CITY_STAT_YB', label: '地市统计年鉴', scope: 'city', suffix: '统计年鉴' },
        { code: 'CITY_YB', label: '地市年鉴', scope: 'city', suffix: '年鉴' },
        { code: 'CITY_DEV_BUL', label: '地市级发展公报', scope: 'city', suffix: '发展公报' },
        { code: 'CITY_GOV_RPT', label: '地市级政府工作报告', scope: 'city', suffix: '政府工作报告' },
        { code: 'PROV_STAT_YB', label: '省级统计年鉴', scope: 'province', suffix: '统计年鉴' },
        { code: 'PROV_YB', label: '省级年鉴', scope: 'province', suffix: '年鉴' },
        { code: 'PROF_YB', label: '专业年鉴', scope: 'manual', suffix: '专业年鉴' },
        { code: 'SPECIAL_RPT', label: '专项报告', scope: 'manual', suffix: '专项报告' },
        { code: 'GOV_INFO_RPT', label: '政府信息公开报告', scope: 'city', suffix: '政府信息公开报告' },
    ];
    let formSourceOptions = DEFAULT_FORM_SOURCE_OPTIONS.slice();

    async function loadFormSourceOptions() {
        try {
            const res = await fetch('/dashboard/api/indicator-sources/?scope=form', { credentials: 'same-origin' });
            const json = await res.json();
            if (json.success && Array.isArray(json.sources) && json.sources.length) {
                formSourceOptions = json.sources;
            }
        } catch (e) {
            console.warn('加载数据来源选项失败，使用默认配置', e);
        }
        if (window.IndicatorSourceInput) {
            IndicatorSourceInput.setOptions(formSourceOptions);
        }
    }

    function getSelectedProvince() {
        const provSel = document.getElementById('province-select');
        return provSel ? provSel.value : '';
    }

    function buildSourceCellHtml(nameAttr, city) {
        return IndicatorSourceInput.buildCellHtml(nameAttr, city, getSelectedProvince());
    }

    const indicatorCategories = {
        'admin': ['#市数量(个)', '#区数量(个)', '#县数量(个)', '#辖区面积(平方公里)'],

    function buildTableHeaders(indicators) {
        const thead = document.querySelector('#manual-section .data-table thead');
        if (!thead) return;
        const firstRow = thead.querySelector('tr:first-child');
        const secondRow = thead.querySelector('tr:nth-child(2)');
        
        firstRow.innerHTML = '<th class="border border-blue-200 px-4 py-3 text-left text-blue-700 font-semibold min-w-24 bg-white">城市</th>';
        indicators.forEach(ind => {
            const th = document.createElement('th');
            th.className = 'border border-blue-200 px-4 py-3 text-left text-blue-700 font-medium';
            th.colSpan = 4;
            th.setAttribute('data-indicator', ind);
            th.textContent = ind;
            firstRow.appendChild(th);
        });
        
        secondRow.innerHTML = '<th class="border border-blue-200 px-2 py-2 text-left text-slate-500 font-medium text-xs min-w-20 bg-gray-50"></th>';
        indicators.forEach(() => {
            ['数值', '备注', '数据来源', '去年参考'].forEach(title => {
                const th = document.createElement('th');
                th.className = 'border border-blue-200 px-2 py-2 text-left text-slate-700 font-medium text-xs' + (title === '数据来源' ? ' source-cell' : '');
                th.textContent = title;
                secondRow.appendChild(th);
            });
        });
    }

    function renderTableRows() {
        const tbody = document.querySelector('#manual-section .data-table tbody');
        if (!tbody) return;
        tbody.innerHTML = '';
        
        const cities = Array.from(globalSelectedCities);
        const headers = document.querySelectorAll('#manual-section .data-table thead th[data-indicator]');
        const groups = headers.length;
        
        if (!cities.length) {
            const tr = tbody.insertRow();
            tr.innerHTML = `<td colspan="${1 + (groups * 4 || 2)}" class="text-center text-slate-400 p-6">请在上方选择城市</td>`;
            updateProgress();
            return;
        }
        if (!groups) {
            const tr = tbody.insertRow();
            tr.innerHTML = `<td colspan="2" class="text-left text-slate-400 p-6">请先在指标筛选中勾选具体指标</td>`;
            updateProgress();
            return;
        }
        
        cities.forEach(city => {
            const tr = tbody.insertRow();
            const tdCity = tr.insertCell();
            tdCity.className = 'border border-blue-200 px-4 py-3 text-slate-800 font-medium bg-blue-50/30';
            tdCity.textContent = city;
            
            for (let g = 0; g < groups; g++) {
                const indName = headers[g].getAttribute('data-indicator');
                const safe = s => ('' + s).replace(/\s+/g, '_').replace(/[^\w\-]/g, '').toLowerCase();
                const cityKey = safe(city);
                const indKey = safe(indName);
                
                const valCell = tr.insertCell();
                valCell.className = 'border border-blue-200 px-2 py-2';
                valCell.innerHTML = `<input placeholder="数值" type="text" name="data[${cityKey}][${indKey}][value]" class="w-full bg-white border border-slate-300 rounded-lg px-2 py-1 text-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-200">`;
                
                const noteCell = tr.insertCell();
                noteCell.innerHTML = `<input placeholder="备注" type="text" name="data[${cityKey}][${indKey}][note]" class="w-full bg-white border border-slate-300 rounded-lg px-2 py-1 text-sm">`;
                
                const srcCell = tr.insertCell();
                srcCell.className = 'border border-blue-200 px-2 py-2 source-cell';
                srcCell.innerHTML = buildSourceCellHtml(`data[${cityKey}][${indKey}][source]`, city);
                
                const refCell = tr.insertCell();
                refCell.className = 'border border-blue-200 px-2 py-2 text-slate-400 text-xs';
                refCell.innerText = '-';
            }
        });
        attachProgressListeners();
        const manualSection = document.getElementById('manual-section');
        if (window.IndicatorSourceInput) {
            IndicatorSourceInput.bindAllIn(manualSection);
        }
        loadExistingFormData();
        updateProgress();
    }

    async function loadExistingFormData() {
        const yearSel = document.getElementById('year-select');
        const year = (yearSel?.value || yearSel?.options[yearSel?.selectedIndex]?.text || '').replace(/[^\d]/g, '');
        if (!year) return;

        const cities = Array.from(globalSelectedCities);
        const headers = Array.from(document.querySelectorAll('#manual-section .data-table thead th[data-indicator]'));
        const indicators = headers.map(h => h.getAttribute('data-indicator')).filter(Boolean);
        if (!cities.length || !indicators.length) return;

        try {
            const params = new URLSearchParams({
                scope: 'city',
                year,
                cities: cities.join(','),
                indicators: indicators.join(','),
            });
            const res = await fetch(`/dashboard/api/input-form-data/?${params}`, { credentials: 'same-origin' });
            const json = await res.json();
            if (!json.success || !json.data) return;

            const tbody = document.querySelector('#manual-section .data-table tbody');
            if (!tbody) return;

            tbody.querySelectorAll('tr').forEach(tr => {
                const city = tr.cells[0]?.textContent?.trim();
                if (!city || !json.data[city]) return;
                const cityData = json.data[city];
                headers.forEach((th, g) => {
                    const indName = th.getAttribute('data-indicator');
                    const record = cityData[indName];
                    if (!record) return;
                    const base = 1 + g * 4;
                    const valInput = tr.cells[base]?.querySelector('input[placeholder="数值"]');
                    const noteInput = tr.cells[base + 1]?.querySelector('input');
                    const sourceWrap = tr.cells[base + 2]?.querySelector('.source-input-wrap');
                    const refCell = tr.cells[base + 3];
                    if (valInput && record.value != null && record.value !== '') {
                        valInput.value = record.value;
                    }
                    if (noteInput && record.note) noteInput.value = record.note;
                    if (sourceWrap && record.source && window.IndicatorSourceInput) {
                        IndicatorSourceInput.applyLoadedValue(sourceWrap, record.source, city, getSelectedProvince());
                    }
                    if (refCell && record.reference != null && record.reference !== '') {
                        refCell.textContent = record.reference;
                    }
                });
            });
            updateProgress();
        } catch (e) {
            console.warn('加载已录入数据失败', e);
        }
    }

    function renderCitiesForProvince(prov) {
        const container = document.getElementById('city-items');
        const emptyDiv = document.getElementById('city-empty');
        if (!container) return;
        container.innerHTML = '';
        
        let cities = [];
        if (prov && prov !== '' && provinceCityMap[prov]) {
            cities = provinceCityMap[prov];
        } else if (!prov || prov === '') {
            cities = Object.values(provinceCityMap).flat();
        }
        
        if (!cities.length) {
            emptyDiv.classList.remove('hidden');
            return;
        }
        emptyDiv.classList.add('hidden');
        
        cities.forEach(city => {
            const div = document.createElement('div');
            div.className = 'flex items-center mb-1';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.id = `city_${city.replace(/\s/g, '_')}`;
            cb.className = 'rounded border-slate-300 text-blue-500 city-checkbox';
            cb.value = city;
            cb.checked = globalSelectedCities.has(city);
            
            const label = document.createElement('label');
            label.htmlFor = cb.id;
            label.className = 'ml-2 text-slate-700 text-sm cursor-pointer flex-1';
            label.textContent = city;
            
            cb.addEventListener('change', function(e) {
                e.stopPropagation();
                if (cb.checked) {
                    globalSelectedCities.add(city);
                } else {
                    globalSelectedCities.delete(city);
                }
                renderTableRows();
            });
            
            label.addEventListener('click', function(e) {
                e.preventDefault();
                cb.checked = !cb.checked;
                const changeEvent = new Event('change', { bubbles: true });
                cb.dispatchEvent(changeEvent);
            });
            
            div.appendChild(cb);
            div.appendChild(label);
            container.appendChild(div);
        });
    }

    function bindSelectAllButtons() {
        const selectAllBtn = document.getElementById('select-all-cities');
        const deselectAllBtn = document.getElementById('deselect-all-cities');
        
        if (selectAllBtn) {
            selectAllBtn.onclick = function() {
                document.querySelectorAll('#city-items .city-checkbox').forEach(cb => {
                    cb.checked = true;
                    globalSelectedCities.add(cb.value);
                });
                renderTableRows();
            };
        }
        if (deselectAllBtn) {
            deselectAllBtn.onclick = function() {
                document.querySelectorAll('#city-items .city-checkbox').forEach(cb => {
                    cb.checked = false;
                    globalSelectedCities.delete(cb.value);
                });
                renderTableRows();
            };
        }
    }

    function populateSubfilter(categoryKey) {
        const content = document.getElementById('indicator-content');
        if (!content) return;
        content.innerHTML = '';
        
        const items = indicatorCategories[categoryKey] || [];
        
        const ctrlDiv = document.createElement('div');
        ctrlDiv.className = 'flex justify-end mb-2 space-x-3';
        const btnAll = document.createElement('button');
        btnAll.type = 'button';
        btnAll.className = 'text-xs text-blue-600 hover:text-blue-800';
        btnAll.textContent = '全选';
        const btnNone = document.createElement('button');
        btnNone.type = 'button';
        btnNone.className = 'text-xs text-slate-500 hover:text-slate-700';
        btnNone.textContent = '取消全选';
        ctrlDiv.appendChild(btnAll);
        ctrlDiv.appendChild(btnNone);
        content.appendChild(ctrlDiv);
        
        const listDiv = document.createElement('div');
        listDiv.className = 'flex flex-col space-y-2';
        
        items.forEach((item, idx) => {
            const label = item.replace(/^#/, '');
            const id = `indicator_${categoryKey}_${idx}`;
            const row = document.createElement('div');
            row.className = 'flex items-center w-full';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'indicator-checkbox rounded border-slate-300 text-blue-500';
            cb.value = label;
            cb.id = id;
            cb.checked = window.globalSelectedIndicators.includes(label);
            
            const lab = document.createElement('label');
            lab.htmlFor = id;
            lab.className = 'ml-2 text-slate-700 text-sm truncate cursor-pointer';
            lab.textContent = label;
            
            cb.addEventListener('change', function() {
                if (cb.checked) {
                    if (!window.globalSelectedIndicators.includes(label)) {
                        window.globalSelectedIndicators.push(label);
                    }
                } else {
                    window.globalSelectedIndicators = window.globalSelectedIndicators.filter(v => v !== label);
                }
                buildTableHeaders(window.globalSelectedIndicators);
                renderTableRows();
            });
            
            lab.addEventListener('click', function(e) {
                e.preventDefault();
                cb.checked = !cb.checked;
                const changeEvent = new Event('change', { bubbles: true });
                cb.dispatchEvent(changeEvent);
            });
            
            row.appendChild(cb);
            row.appendChild(lab);
            listDiv.appendChild(row);
        });
        content.appendChild(listDiv);
        
        btnAll.onclick = function() {
            content.querySelectorAll('.indicator-checkbox').forEach(cb => {
                cb.checked = true;
                if (!window.globalSelectedIndicators.includes(cb.value)) {
                    window.globalSelectedIndicators.push(cb.value);
                }
            });
            buildTableHeaders(window.globalSelectedIndicators);
            renderTableRows();
        };
        
        btnNone.onclick = function() {
            const currentVals = Array.from(content.querySelectorAll('.indicator-checkbox')).map(cb => cb.value);
            content.querySelectorAll('.indicator-checkbox').forEach(cb => cb.checked = false);
            window.globalSelectedIndicators = window.globalSelectedIndicators.filter(v => !currentVals.includes(v));
            buildTableHeaders(window.globalSelectedIndicators);
            renderTableRows();
        };
    }

    function setupCityToggle() {
        const label = document.getElementById('city-label');
        const cityList = document.getElementById('city-list');
        const toggleIcon = document.getElementById('city-toggle-icon');
        const placeholder = document.getElementById('city-placeholder');
        const content = document.getElementById('city-content');
        
        function togglePanel(e) {
            e.preventDefault();
            e.stopPropagation();
            const expanded = cityList.style.height !== '52px';
            if (!expanded) {
                placeholder.classList.add('hidden');
                content.classList.remove('hidden');
                cityList.style.height = '200px';
                cityList.style.overflowY = 'auto';
                cityList.style.cursor = 'default';
                toggleIcon.setAttribute('icon', 'mdi:chevron-down');
            } else {
                placeholder.classList.remove('hidden');
                content.classList.add('hidden');
                cityList.style.height = '52px';
                cityList.style.overflowY = 'hidden';
                cityList.style.cursor = 'pointer';
                toggleIcon.setAttribute('icon', 'mdi:chevron-right');
            }
        }
        
        if (label) label.addEventListener('click', togglePanel);
        if (cityList) {
            cityList.addEventListener('click', function(e) {
                const expanded = cityList.style.height !== '52px';
                if (!expanded) togglePanel(e);
            });
        }
    }
    
    function setupIndicatorToggle() {
        const label = document.getElementById('indicator-label');
        const subfilter = document.getElementById('indicator-subfilter');
        const toggleIcon = document.getElementById('indicator-toggle-icon');
        const placeholder = document.getElementById('indicator-placeholder');
        const content = document.getElementById('indicator-content');
        
        function togglePanel(e) {
            e.preventDefault();
            e.stopPropagation();
            const expanded = subfilter.style.height !== '52px';
            if (!expanded) {
                placeholder.classList.add('hidden');
                content.classList.remove('hidden');
                subfilter.style.height = '200px';
                subfilter.style.overflowY = 'auto';
                subfilter.style.cursor = 'default';
                toggleIcon.setAttribute('icon', 'mdi:chevron-down');
            } else {
                placeholder.classList.remove('hidden');
                content.classList.add('hidden');
                subfilter.style.height = '52px';
                subfilter.style.overflowY = 'hidden';
                subfilter.style.cursor = 'pointer';
                toggleIcon.setAttribute('icon', 'mdi:chevron-right');
            }
        }
        
        if (label) label.addEventListener('click', togglePanel);
        if (subfilter) {
            subfilter.addEventListener('click', function(e) {
                const expanded = subfilter.style.height !== '52px';
                if (!expanded) togglePanel(e);
            });
        }
    }

    function setupTabs() {
        const manualTab = document.getElementById('manual-tab');
        const excelTab = document.getElementById('excel-tab');
        const manualSection = document.getElementById('manual-section');
        const excelSection = document.getElementById('excel-section');
        
        if (manualTab && excelTab) {
            manualTab.onclick = function() {
                manualSection.classList.remove('hidden');
                excelSection.classList.add('hidden');
                manualTab.classList.add('font-semibold', 'text-blue-700', 'border-b-2', 'border-blue-600');
                manualTab.classList.remove('font-medium', 'text-slate-600');
                excelTab.classList.remove('font-semibold', 'text-blue-700', 'border-b-2', 'border-blue-600');
                excelTab.classList.add('font-medium', 'text-slate-600');
                attachProgressListeners();
                updateProgress();
            };
            excelTab.onclick = function() {
                excelSection.classList.remove('hidden');
                manualSection.classList.add('hidden');
                excelTab.classList.add('font-semibold', 'text-blue-700', 'border-b-2', 'border-blue-600');
                excelTab.classList.remove('font-medium', 'text-slate-600');
                manualTab.classList.remove('font-semibold', 'text-blue-700', 'border-b-2', 'border-blue-600');
                manualTab.classList.add('font-medium', 'text-slate-600');
            };
        }
    }

    function setupResetButton() {
        const resetBtn = document.getElementById('reset-button');
        if (resetBtn) {
            resetBtn.onclick = function() {
                document.querySelectorAll('#manual-section .data-table tbody input').forEach(i => i.value = '');
                document.querySelectorAll('#manual-section .data-table tbody select').forEach(s => s.selectedIndex = 0);
                updateProgress();
            };
        }
    }

    function setupExcelYearSync() {
        const yearSelect = document.getElementById('year-select');
        const excelYear = document.getElementById('excel-upload-year');
        if (yearSelect && excelYear) {
            function sync() {
                excelYear.value = yearSelect.value.replace(/[^\d]/g, '');
            }
            sync();
            yearSelect.addEventListener('change', sync);
        }
    }



function setupFormSubmit() {
    const form = document.getElementById('manual-form');
    if (form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // ========== 收集表格数据构建 rows_json ==========
            const rows = (function collectRowsData() {
                const out = [];
                const tbody = document.querySelector('#manual-section .data-table tbody');
                if (!tbody) return out;
                
                // 获取年份和省份
                const yearSel = document.getElementById('year-select');
                let year = '';
                if (yearSel) {
                    const ytxt = yearSel.value || yearSel.options[yearSel.selectedIndex]?.text || '';
                    year = ytxt.replace(/[^\d]/g, '');
                }
                const provSel = document.getElementById('province-select');
                const province = provSel ? provSel.value : '';
                
                // 获取所有指标中文名
                const headerEls = document.querySelectorAll('#manual-section .data-table thead th[data-indicator]');
                const indicatorNames = Array.from(headerEls).map(h => h.getAttribute('data-indicator'));
                
                // 遍历每一行（每个城市）
                const rowsList = tbody.querySelectorAll('tr');
                for (let tr of rowsList) {
                    const cityCell = tr.children[0];
                    if (!cityCell) continue;
                    const city = cityCell.textContent.trim();
                    if (!city || city === '请在上方选择城市') continue;
                    
                    let cursor = 1; // 跳过第一列（城市列）
                    const groups = [];
                    
                    for (let g = 0; g < indicatorNames.length; g++) {
                        const valTd = tr.children[cursor];
                        const noteTd = tr.children[cursor + 1];
                        const sourceTd = tr.children[cursor + 2];
                        const refTd = tr.children[cursor + 3];
                        
                        const val = valTd ? (valTd.querySelector('input') ? valTd.querySelector('input').value.trim() : '') : '';
                        const note = noteTd ? (noteTd.querySelector('input') ? noteTd.querySelector('input').value.trim() : '') : '';
                        const source = sourceTd && window.IndicatorSourceInput
                            ? IndicatorSourceInput.readSubmitCode(sourceTd)
                            : '';
                        const reference = refTd ? (refTd.querySelector('input') ? refTd.querySelector('input').value.trim() : (refTd.textContent || '').trim()) : '';
                        const name_zh = indicatorNames[g] || '';
                        
                        groups.push({
                            value: val,
                            note: note,
                            source: source,
                            reference: reference,
                            name_zh: name_zh
                        });
                        cursor += 4;
                    }
                    
                    out.push({
                        city: city,
                        province: province,
                        year: year,
                        groups: groups
                    });
                }
                return out;
            })();
            
            // 将 rows_json 写入隐藏字段
            const hiddenInput = document.getElementById('rows-json');
            if (hiddenInput) {
                hiddenInput.value = JSON.stringify(rows);
            }
            
            // 提交表单
            const submitBtn = document.getElementById('submit-button');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '提交中...';
            submitBtn.disabled = true;
            
            const formData = new FormData(form);
            
            fetch(form.action, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('✅ 提交成功！');
                    setTimeout(() => window.location.reload(), 500);
                } else {
                    alert('❌ 提交失败：' + (data.message || '未知错误'));
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                console.error('错误:', error);
                alert('❌ 网络错误');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            });
        });
    }
}

 

    document.addEventListener('DOMContentLoaded', async function() {

        renderCitiesForProvince('');

        buildTableHeaders([]);

        setupCityToggle();
        setupIndicatorToggle();
        setupTabs();

        const yearSelect = document.getElementById('year-select');

        }
        
        const excelForm = document.getElementById('excel-upload-form');
        if (excelForm) {
            excelForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const yearInput = document.getElementById('excel-upload-year');
                if (!yearInput.value) {
                    alert('请先选择年份！');
                    return;
                }
                const formData = new FormData(excelForm);
                const submitBtn = excelForm.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = '上传中...';
                submitBtn.disabled = true;
                
                fetch(excelForm.action, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('✅ Excel上传成功！');
                        renderTableRows();
                    } else {
                        alert('❌ 上传失败：' + (data.message || '未知错误'));
                    }
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                })
                .catch(error => {
                    alert('❌ 网络错误');
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                });
            });
        }
    });
