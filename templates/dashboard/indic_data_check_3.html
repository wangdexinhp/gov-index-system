<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>

<script src="https://cdn.bootcdn.net/ajax/libs/iconify/3.1.1/iconify.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<!-- 引入 ECharts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<!-- 引入中国地图 -->
<script src="https://cdn.jsdelivr.net/npm/echarts-map/js/china.js"></script>
<style>
    body {
        background: #f0f4f9;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 表格样式 */
    .table-wrapper {
        overflow-x: auto;
        overflow-y: auto;
        max-height: 55vh;
        width: 100%;
        border-radius: 1rem;
    }
    
    .data-table {
        min-width: 600px;
        width: 100%;
        border-collapse: collapse;
    }
    
    .data-table th,
    .data-table td {
        border: 1px solid #bfdbfe;
        padding: 10px 12px;
        vertical-align: middle;
    }
    
    .data-table th {
        background: #f8fafc;
        font-weight: 600;
        color: #1e40af;
    }
    
    /* 进度条样式 */
    .progress-bar {
        height: 8px;
        background: #e2e8f0;
        border-radius: 10px;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        border-radius: 10px;
        transition: width 0.3s ease;
    }
    .progress-fill.high {
        background: #10b981;
    }
    .progress-fill.medium {
        background: #f59e0b;
    }
    .progress-fill.low {
        background: #ef4444;
    }
    
    /* 统计卡片 */
    .stat-card {
        transition: all 0.2s;
    }
    .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px -6px rgba(0,0,0,0.1);
    }
    
    /* 状态标签 */
    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 500;
    }
    .status-imported {
        background: #dcfce7;
        color: #15803d;
    }
    .status-missing {
        background: #fee2e2;
        color: #b91c1c;
    }
    .status-partial {
        background: #fef9c3;
        color: #a16207;
    }
    
    /* 滚动条 */
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    ::-webkit-scrollbar-track {
        background: #e2e8f0;
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 10px;
    }
    
    /* 筛选栏 */
    .filter-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .filter-select {
        padding: 6px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 13px;
        background: white;
        cursor: pointer;
    }
</style>

<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen font-sans antialiased">

        "辽宁省": ["沈阳市", "大连市", "鞍山市", "抚顺市", "本溪市", "丹东市", "锦州市", "营口市", "阜新市", "辽阳市", "盘锦市", "铁岭市", "朝阳市", "葫芦岛市"],
        "云南省": ["昆明市", "曲靖市", "玉溪市", "保山市", "昭通市", "丽江市", "普洱市", "临沧市", "楚雄州", "红河州", "文山州", "西双版纳州", "大理州", "德宏州", "怒江州", "迪庆州"],
        "山西省": ["太原市", "大同市", "阳泉市", "长治市", "晋城市", "朔州市", "晋中市", "运城市", "忻州市", "临汾市", "吕梁市"],
        "贵州省": ["贵阳市", "六盘水市", "遵义市", "安顺市", "毕节市", "铜仁市", "黔西南州", "黔东南州", "黔南州"],
        "江西省": ["南昌市", "九江市", "景德镇市", "萍乡市", "新余市", "鹰潭市", "赣州市", "吉安市", "宜春市", "抚州市", "上饶市"],
        "广西壮族自治区": ["南宁市", "柳州市", "桂林市", "梧州市", "北海市", "防城港市", "钦州市", "贵港市", "玉林市", "百色市", "贺州市", "河池市", "来宾市", "崇左市"],
        "黑龙江省": ["哈尔滨市", "齐齐哈尔市", "鸡西市", "鹤岗市", "双鸭山市", "大庆市", "伊春市", "佳木斯市", "七台河市", "牡丹江市", "黑河市", "绥化市", "大兴安岭地区"]
    };
    
    // 指标列表
    const indicatorsList = Object.keys(indicatorGroupMap);
    totalIndicators = indicatorsList.length;
    
    // 生成模拟数据
    function generateMockData() {
        // 生成地市完成率数据
        cityCompletionData = [];
        let allCities = [];
        for (const province in defaultProvinceCityMap) {
            allCities = allCities.concat(defaultProvinceCityMap[province]);
        }
        totalCities = allCities.length;
        
        allCities.forEach(city => {
            const rate = 30 + Math.random() * 70;
            const completed = Math.floor(rate / 100 * indicatorsList.length);
            cityCompletionData.push({
                city: city,
                province: getProvinceByCity(city),
                completed: completed,
                total: indicatorsList.length,
                rate: parseFloat(rate.toFixed(1))
            });
        });
        
        cityCompletionData.sort((a, b) => b.rate - a.rate);
        
        // 生成指标覆盖率数据
        indicatorCoverageData = [];
        indicatorsList.forEach(indicator => {
            const rate = 20 + Math.random() * 75;
            const covered = Math.floor(rate / 100 * totalCities);
            indicatorCoverageData.push({
                indicator: indicator,
                group: indicatorGroupMap[indicator] || 'other',
                covered: covered,
                total: totalCities,
                rate: parseFloat(rate.toFixed(1))
            });
        });
        
        indicatorCoverageData.sort((a, b) => b.rate - a.rate);
        
        // 初始化筛选数据
        applyIndicatorGroupFilter();
        
        updateStatistics();
        renderCityRanking();
        renderChinaMap();
    }
    
    // 应用指标组筛选
    function applyIndicatorGroupFilter() {
        const selectedGroup = document.getElementById('indicatorGroupFilter').value;
        if (selectedGroup === 'all') {
            filteredIndicatorData = [...indicatorCoverageData];
        } else {
            filteredIndicatorData = indicatorCoverageData.filter(item => item.group === selectedGroup);
        }
        renderIndicatorCoverage();
        
        const countSpan = document.getElementById('filteredCount');
        if (countSpan) {
            countSpan.textContent = `共 ${filteredIndicatorData.length} 项指标`;
        }
    }
    
    function getProvinceByCity(city) {
        for (const province in defaultProvinceCityMap) {
            if (defaultProvinceCityMap[province].includes(city)) {
                return province;
            }
        }
        return "其他";
    }
    
    function updateStatistics() {
        const avgCompletion = cityCompletionData.reduce((sum, c) => sum + c.rate, 0) / cityCompletionData.length;
        const avgCoverage = indicatorCoverageData.reduce((sum, i) => sum + i.rate, 0) / indicatorCoverageData.length;
        
        document.getElementById('totalCities').innerText = totalCities;
        document.getElementById('avgCompletionRate').innerText = avgCompletion.toFixed(1) + '%';
        document.getElementById('totalIndicators').innerText = totalIndicators;
        document.getElementById('avgCoverageRate').innerText = avgCoverage.toFixed(1) + '%';
    }
    
    function renderCityRanking() {
        const tbody = document.getElementById('cityRankingBody');
        if (!cityCompletionData.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-slate-400 py-8">暂无数据</td></tr>';
            return;
        }
        
        tbody.innerHTML = cityCompletionData.slice(0, 20).map((item, idx) => {
            let progressClass = 'low';
            if (item.rate >= 70) progressClass = 'high';
            else if (item.rate >= 40) progressClass = 'medium';
            
            return `
                <tr class="hover:bg-blue-50/30 transition">
                    <td class="text-center font-medium">${idx + 1}</td>
                    <td class="font-medium text-slate-800">${item.city}</td>
                    <td class="text-slate-600">${item.province}</td>
                    <td class="text-center">${item.completed}/${item.total}</td>
                    <td>
                        <div class="flex items-center gap-2">
                            <div class="progress-bar flex-1">
                                <div class="progress-fill ${progressClass}" style="width: ${item.rate}%"></div>
                            </div>
                            <span class="text-sm font-medium ${item.rate >= 70 ? 'text-green-600' : (item.rate >= 40 ? 'text-yellow-600' : 'text-red-500')}">${item.rate}%</span>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }
    
    function renderIndicatorCoverage() {
        const tbody = document.getElementById('indicatorCoverageBody');
        if (!filteredIndicatorData.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-slate-400 py-8">暂无数据</td></tr>';
            return;
        }
        
        tbody.innerHTML = filteredIndicatorData.map((item, idx) => {
            let progressClass = 'low';
            if (item.rate >= 70) progressClass = 'high';
            else if (item.rate >= 40) progressClass = 'medium';
            
            const statusBadge = item.rate >= 70 
                ? '<span class="status-badge status-imported">覆盖率较高</span>'
                : (item.rate >= 40 ? '<span class="status-badge status-partial">部分覆盖</span>' : '<span class="status-badge status-missing">覆盖率较低</span>');
            
            return `
                <tr class="hover:bg-blue-50/30 transition">
                    <td class="text-center font-medium">${idx + 1}</td>
                    <td class="font-medium text-slate-800">${item.indicator}</td>
                    <td class="text-slate-600">${groupNames[item.group] || '其他'}</td>
                    <td class="text-center">${item.covered}/${item.total}</td>
                    <td class="min-w-[180px]">
                        <div class="flex items-center gap-2">
                            <div class="progress-bar flex-1">
                                <div class="progress-fill ${progressClass}" style="width: ${item.rate}%"></div>
                            </div>
                            <span class="text-sm font-medium ${item.rate >= 70 ? 'text-green-600' : (item.rate >= 40 ? 'text-yellow-600' : 'text-red-500')}">${item.rate}%</span>
                        </div>
                    </td>
                    <td>${statusBadge}</td>
                </tr>
            `;
        }).join('');
    }
    
    function renderChinaMap() {
        const dom = document.getElementById('chinaMap');
        if (!dom) return;
        if (myChart) myChart.dispose();
        myChart = echarts.init(dom);
        
        const mapData = cityCompletionData.map(item => ({
            name: item.city,
            value: item.rate,
            completed: item.completed,
            total: item.total
        }));
        
        myChart.setOption({
            tooltip: {
                trigger: 'item',
                formatter: function(params) {
                    if (params.data) {
                        return `${params.name}<br/>完成率: ${params.data.value}%<br/>已录入: ${params.data.completed}/${params.data.total}`;
                    }
                    return params.name;
                }
            },
            visualMap: {
                min: 0, max: 100, calculable: true,
                inRange: { color: ['#fef0d9', '#fdcc8a', '#fc8d59', '#d7301f', '#7f0000'] },
                outOfRange: { color: ['#e2e8f0'] },
                text: ['高', '低']
            },
            series: [{
                name: '地市数据录入完成率',
                type: 'map', map: 'china', roam: true, zoom: 1.2,
                data: mapData,
                label: { normal: { show: false }, emphasis: { show: true, color: '#1e40af' } },
                itemStyle: {
                    normal: { borderColor: '#cbd5e1', borderWidth: 0.5, areaColor: '#e2e8f0' },
                    emphasis: { areaColor: '#bfdbfe', borderWidth: 1, borderColor: '#3b82f6' }
                }
            }]
        });
        
        window.addEventListener('resize', () => myChart?.resize());
    }
    
    function sortByRateDesc() {
        cityCompletionData.sort((a, b) => b.rate - a.rate);
        renderCityRanking();
    }
    
    function sortByNameAsc() {
        cityCompletionData.sort((a, b) => a.city.localeCompare(b.city));
        renderCityRanking();
    }
    
    function loadProvinceCityMap() {
        return fetch('/dashboard/get-city-map/')
            .then(res => res.json())
            .then(data => { provinceCityMap = data || defaultProvinceCityMap; return provinceCityMap; })
            .catch(() => { provinceCityMap = defaultProvinceCityMap; return provinceCityMap; });
    }
    
    function initYearSelect() {
        const yearSelect = document.getElementById('yearSelect');
        const currentYear = new Date().getFullYear();
        yearSelect.innerHTML = '<option value="">所有年份</option>';
        for (let y = 2020; y <= currentYear; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y + '年';
            if (y === 2025) opt.selected = true;
            yearSelect.appendChild(opt);
        }
    }
    
    function initProvinceSelect() {
        const provSelect = document.getElementById('provinceSelect');
        const provinces = Object.keys(provinceCityMap);
        provSelect.innerHTML = '<option value="">全部省份</option>';
        provinces.forEach(prov => {
            const opt = document.createElement('option');
            opt.value = prov;
            opt.textContent = prov;
            provSelect.appendChild(opt);
        });
    }
    
    function updateCitySelect() {
        const province = document.getElementById('provinceSelect').value;
        const citySelect = document.getElementById('citySelect');
        let cities = [];
        if (province && provinceCityMap[province]) {
            cities = provinceCityMap[province];
        } else {
            for (const p in provinceCityMap) cities = cities.concat(provinceCityMap[p]);
        }
        citySelect.innerHTML = '<option value="">全部城市</option>';
        cities.slice(0, 50).forEach(city => {
            const opt = document.createElement('option');
            opt.value = city;
            opt.textContent = city;
            citySelect.appendChild(opt);
        });
    }
    
    function performQuery() {
        const queryBtn = document.getElementById('queryBtn');
        const originalText = queryBtn.innerHTML;
        queryBtn.innerHTML = '<iconify-icon icon="mdi:loading" class="animate-spin"></iconify-icon> 查询中...';
        queryBtn.disabled = true;
        
        setTimeout(() => {
            generateMockData();
            queryBtn.innerHTML = originalText;
            queryBtn.disabled = false;
        }, 500);
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        loadProvinceCityMap().then(() => {
            initYearSelect();
            initProvinceSelect();
            updateCitySelect();
            
            document.getElementById('provinceSelect').addEventListener('change', updateCitySelect);
            document.getElementById('queryBtn').addEventListener('click', performQuery);
            document.getElementById('sortByRateDesc').addEventListener('click', sortByRateDesc);
            document.getElementById('sortByNameAsc').addEventListener('click', sortByNameAsc);
            document.getElementById('indicatorGroupFilter').addEventListener('change', applyIndicatorGroupFilter);
            
            generateMockData();
        });
    });
</script>
</body>
</html>
