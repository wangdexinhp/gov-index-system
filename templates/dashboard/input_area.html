<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>区县指标录入 | 数据指标管理系统</title>
<script src="/static/js/tailwindcss.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/iconify/3.1.1/iconify.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
    /* 蓝调商务风格 - 与主系统统一 */
    body {
        background: #f0f4f9;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 表格容器支持横向滚动 */
    .table-wrapper {
        overflow-x: auto;
        overflow-y: auto;
        max-height: 60vh;
        width: 100%;
    }
    
    /* 表格固定最小宽度 */
    .data-table {
        min-width: 800px;
        width: max-content;
        border-collapse: collapse;
    }
    
    /* 固定第一列 */
    .data-table th:first-child,
    .data-table td:first-child {
        position: sticky;
        left: 0;
        background: #ffffff;
        z-index: 10;
        box-shadow: 4px 0 8px -4px rgba(0, 80, 120, 0.15);
    }
    
    .data-table thead th:first-child {
        z-index: 11;
        background: #f0f9ff;
    }
    
    .data-table th,
    .data-table td {
        border: 1px solid #bfdbfe;
        padding: 8px 12px;
        vertical-align: top;
    }
    
    .data-table th[data-indicator] {
        min-width: 160px;
        max-width: 200px;
        white-space: normal;
        word-break: break-word;
    }
    
    .data-table th:not(:first-child),
    .data-table td:not(:first-child) {
        min-width: 120px;
        width: 120px;
    }
    
    .data-table input,
    .data-table select {
        width: 100%;
        min-width: 100px;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 13px;
    }
    
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: #e2e8f0;
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 10px;
    }
    
    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #3b82f6 !important;
        box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
    }
    
    .city-checkbox, .area-checkbox, .indicator-checkbox {
        cursor: pointer;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
    }
</style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen antialiased">

<!-- 导航栏 -->
<header class="bg-white border-b border-blue-200 shadow-sm h-20 flex items-center px-8 sticky top-0 z-50 backdrop-blur-sm bg-white/95">
<div class="flex items-center space-x-3">
    <div class="bg-blue-600 rounded-xl p-2 shadow-md">
        <iconify-icon class="text-white text-2xl" icon="mdi:chart-line"></iconify-icon>
    </div>
    <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-700 to-cyan-600 bg-clip-text text-transparent">数据指标管理系统</h1>
</div>
<div class="ml-auto flex items-center space-x-4">
<div class="flex space-x-3 mr-6">
    <a href="/dashboard/" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm shadow-sm transition-all">指标录入</a>
    <a href="/dashboard/order-price/" class="text-slate-700 hover:text-blue-700 font-medium py-2 px-4 rounded-lg text-sm border border-slate-300 hover:border-blue-400 transition">订单价格配置</a>
    <a href="/dashboard/single-indicator-year-query/" class="text-slate-700 hover:text-blue-700 font-medium py-2 px-4 rounded-lg text-sm border border-slate-300 hover:border-blue-400 transition">单指标历年查询</a>
    <a href="/dashboard/single-indicator-city-query/" class="text-slate-700 hover:text-blue-700 font-medium py-2 px-4 rounded-lg text-sm border border-slate-300 hover:border-blue-400 transition">单指标多城市查询</a>
    <a href="/dashboard/many-indicator-query/" class="text-slate-700 hover:text-blue-700 font-medium py-2 px-4 rounded-lg text-sm border border-slate-300 hover:border-blue-400 transition">多城市多指标查询</a>
</div>
<div class="text-right">
<div class="flex-shrink-0 flex items-center">
    <a href="{% url 'landing:home' %}" class="flex items-center">
        <span class="text-xl font-medium tracking-wide text-blue-800">城策智库</span>
    </a>
</div>
</div>
<div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center shadow-inner">
    <iconify-icon class="text-blue-600 text-xl" icon="mdi:account-circle"></iconify-icon>
</div>
</div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">

    <div class="flex items-center space-x-3 mb-6">
        <div class="bg-blue-100 p-2 rounded-xl">
            <iconify-icon class="text-blue-600 text-2xl" icon="fluent:database-search-24-filled"></iconify-icon>
        </div>
        <div class="flex space-x-3">
            <a href="/dashboard/" class="bg-white border border-slate-300 text-slate-700 font-medium py-2 px-5 rounded-xl hover:bg-slate-50 transition">地市指标录入</a>
            <a href="/dashboard/area_input" class="bg-blue-600 text-white font-medium py-2 px-5 rounded-xl shadow-sm hover:bg-blue-700 transition">区县指标录入</a>
            <a href="/dashboard/indicator-check" class="bg-white border border-slate-300 text-slate-700 font-medium py-2 px-5 rounded-xl hover:bg-slate-50 transition">指标校验</a>
        </div>
    </div>

    <!-- 筛选卡片 -->
    <div class="bg-white border border-blue-200 rounded-2xl shadow-md p-6 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-6 gap-6">
            <div>
                <label class="block text-sm font-semibold text-blue-700 mb-2">📅 选择年份</label>
                <select id="year-select" class="w-full bg-white border border-slate-300 rounded-xl py-3 px-4 text-slate-700 focus:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none">
                    <option>选择年份</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-blue-700 mb-2">📍 选择省份</label>
                <select id="province-select" class="w-full bg-white border border-slate-300 rounded-xl py-3 px-4 text-slate-700 focus:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none">
                    <option value="">-- 请选择省份 --</option>
                    <option value="北京市">北京市</option><option value="天津市">天津市</option><option value="上海市">上海市</option>
                    <option value="重庆市">重庆市</option><option value="河北省">河北省</option><option value="山西省">山西省</option>
                    <option value="辽宁省">辽宁省</option><option value="吉林省">吉林省</option><option value="黑龙江省">黑龙江省</option>
                    <option value="江苏省">江苏省</option><option value="浙江省">浙江省</option><option value="安徽省">安徽省</option>
                    <option value="福建省">福建省</option><option value="江西省">江西省</option><option value="山东省">山东省</option>
                    <option value="河南省">河南省</option><option value="湖北省">湖北省</option><option value="湖南省">湖南省</option>
                    <option value="广东省">广东省</option><option value="海南省">海南省</option><option value="四川省">四川省</option>
                    <option value="贵州省">贵州省</option><option value="云南省">云南省</option><option value="陕西省">陕西省</option>
                    <option value="甘肃省">甘肃省</option><option value="青海省">青海省</option><option value="内蒙古自治区">内蒙古自治区</option>
                    <option value="广西壮族自治区">广西壮族自治区</option><option value="西藏自治区">西藏自治区</option>
                    <option value="宁夏回族自治区">宁夏回族自治区</option><option value="新疆维吾尔自治区">新疆维吾尔自治区</option>
                </select>
            </div>
            <div class="min-w-0">
                <label class="block text-sm font-semibold text-blue-700 mb-2">🏙️ 选择城市 (多选)</label>
                <div id="city-list" class="bg-white border border-slate-300 rounded-xl p-3 max-h-44 overflow-y-auto shadow-sm">
                    <div class="flex justify-end mb-2 space-x-3">
                        <button type="button" id="select-all-cities" class="text-xs text-blue-600 hover:text-blue-800 font-medium">全选</button>
                        <button type="button" id="deselect-all-cities" class="text-xs text-slate-500 hover:text-slate-700">取消全选</button>
                    </div>
                    <div class="space-y-2" id="city-items"></div>
                    <div id="city-empty" class="text-gray-400 text-sm p-2 hidden">无可选城市</div>
                </div>
            </div>
            <div class="min-w-0">
                <label class="block text-sm font-semibold text-blue-700 mb-2">🗺️ 选择区县 (多选)</label>
                <div id="area-list" class="bg-white border border-slate-300 rounded-xl p-3 max-h-44 overflow-y-auto shadow-sm">
                    <div class="flex justify-end mb-2 space-x-3">
                        <button type="button" id="select-all-areas" class="text-xs text-blue-600 hover:text-blue-800 font-medium">全选</button>
                        <button type="button" id="deselect-all-areas" class="text-xs text-slate-500 hover:text-slate-700">取消全选</button>
                    </div>
                    <div class="space-y-2" id="area-items"></div>
                    <div id="area-empty" class="text-gray-400 text-sm p-2 hidden">无可选区县</div>
                </div>
            </div>
            <div class="min-w-0 overflow-hidden">
                <label class="block text-sm font-semibold text-blue-700 mb-2">📊 指标组</label>
                <select id="indicator-filter" class="w-full bg-white border border-slate-300 rounded-xl py-3 px-4 text-slate-700 focus:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none">
                    <option value="population">人口数据</option>
                    <option value="economic_growth">经济增长数据</option>
                </select>
            </div>
            <div class="min-w-0 overflow-hidden">
                <label class="block text-sm font-semibold text-blue-700 mb-2">🔍 筛选指标（多选）</label>
                <div id="indicator-subfilter" class="w-full bg-white border border-slate-300 rounded-xl p-3 max-h-44 overflow-y-auto shadow-sm"></div>
            </div>
        </div>
    </div>

    <div class="mb-6 border-b border-blue-200">
        <div class="flex space-x-6">
            <button class="pb-3 px-1 font-semibold text-blue-700 border-b-2 border-blue-600 transition" id="manual-tab">✍️ 手工录入</button>
            <button class="pb-3 px-1 font-medium text-slate-600 hover:text-blue-600 transition" id="excel-tab">📎 Excel上传</button>
        </div>
    </div>

    <form id="manual-form" method="post" action="/dashboard/submit-area/">
        {% csrf_token %}  
        <div class="bg-white border border-blue-200 rounded-2xl shadow-md p-6 mb-8" id="manual-section">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr class="bg-gradient-to-r from-blue-50 to-white sticky top-0 z-10">
                            <th class="border border-blue-200 px-4 py-3 text-left text-blue-700 font-semibold min-w-24 bg-white">区县</th>
                        </tr>
                        <tr class="bg-gray-50 sticky top-12 z-10">
                            <th class="border border-blue-200 px-2 py-2 text-left text-slate-500 font-medium text-xs min-w-20 bg-gray-50"></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <input type="hidden" id="rows-json" name="rows_json" value="" />
            <div class="flex space-x-4 mt-6">
                <button id="submit-button" type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-xl shadow-md transition-all">💾 提交数据</button>
                <button id="reset-button" type="button" class="bg-white border border-slate-300 text-slate-700 font-medium py-3 px-8 rounded-xl hover:bg-slate-50 transition">🔄 重置表单</button>

    <form id="excel-upload-form" action="/dashboard/upload_excel_area/" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="bg-white border border-blue-200 rounded-2xl shadow-md p-6 mb-8 hidden" id="excel-section">
            <div class="text-center py-8">
                <div class="mx-auto w-20 h-20 flex items-center justify-center bg-blue-100 rounded-full mb-6 shadow-inner">
                    <iconify-icon class="text-blue-600 text-4xl" icon="mdi:file-excel"></iconify-icon>
                </div>
                <h3 class="text-xl font-bold text-slate-800 mb-3">上传Excel数据文件</h3>
                <p class="text-slate-500 mb-8">支持 .xlsx 格式，请确保数据格式符合区县模板要求</p>
                <div class="border-2 border-dashed border-blue-300 rounded-xl max-w-xl mx-auto p-8 bg-blue-50/40">
                    <div class="flex flex-col items-center gap-4">
                        <iconify-icon class="text-blue-500 text-4xl" icon="mdi:cloud-upload"></iconify-icon>
                        <input type="file" name="excel_file" accept=".xlsx,.xls" required class="text-sm text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-8 rounded-xl shadow transition">上传并解析</button>
                    </div>
                </div>
                <div class="mt-8">
                    <button type="button" class="flex items-center text-blue-600 hover:text-blue-800 mx-auto gap-1 font-medium">
                        <iconify-icon icon="mdi:download"></iconify-icon> 下载Excel模板
                    </button>
                </div>
            </div>
        </div>
    </form>

    <div class="bg-gradient-to-r from-blue-50 to-white border border-blue-200 rounded-2xl shadow-sm p-4 mb-8">
        <div class="flex items-center justify-between flex-wrap gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-100 p-2 rounded-full">
                    <iconify-icon class="text-blue-600 text-xl" icon="mdi:progress-clock"></iconify-icon>
                </div>
                <div>
                    <p class="text-sm text-slate-500">数据录入进度</p>
                    <p class="text-lg font-bold text-blue-700" id="progress-text">进度：已完成0/48指标</p>
                </div>
            </div>
            <div class="w-64 h-3 bg-slate-200 rounded-full overflow-hidden shadow-inner">
                <div class="h-full bg-gradient-to-r from-blue-500 to-cyan-500 rounded-full transition-all duration-300" id="progress-bar" style="width: 0%"></div>
            </div>
        </div>
    </div>
</main>

<script>
    // 年份初始化
    function initYearSelector(selectId = 'year-select') {
        const select = document.getElementById(selectId);
        if (!select) return;
        const currentYear = new Date().getFullYear();
        while (select.options.length > 1) select.remove(1);
        for (let i = 0; i <= 20; i++) {
            const year = currentYear - i;
            const option = new Option(year + '年', year);
            select.add(option);
        }
        select.selectedIndex = 0;
    }
    initYearSelector();

    // 进度更新
    function updateProgress() {
        const allInputs = document.querySelectorAll('#manual-section .data-table tbody input[placeholder="数值"]');
        const total = allInputs.length;
        let completed = 0;
        allInputs.forEach(inp => { if (inp.value.trim() !== '') completed++; });
        const percent = total ? (completed / total) * 100 : 0;
        document.getElementById('progress-text').innerText = `进度：已完成${completed}/${total}指标`;
        document.getElementById('progress-bar').style.width = percent + '%';
    }
    
    function attachProgressListeners() {
        const inputs = document.querySelectorAll('#manual-section .data-table tbody input[placeholder="数值"], #manual-section .data-table tbody input[placeholder="备注"]');
        inputs.forEach(inp => { 
            inp.removeEventListener('input', updateProgress); 
            inp.addEventListener('input', updateProgress); 
            inp.addEventListener('change', updateProgress); 
        });
    }

    const DEFAULT_FORM_SOURCE_OPTIONS = [
        { code: 'CITY_STAT_YB', label: '地市统计年鉴' },
        { code: 'CITY_YB', label: '地市年鉴' },
        { code: 'PROV_STAT_YB', label: '省级统计年鉴' },
        { code: 'GOV_INFO_RPT', label: '政府信息公开报告' },
    ];
    let formSourceOptions = DEFAULT_FORM_SOURCE_OPTIONS.slice();

    async function loadFormSourceOptions() {
        try {
            const res = await fetch('/dashboard/api/indicator-sources/?scope=form', { credentials: 'same-origin' });
            const json = await res.json();
            if (json.success && Array.isArray(json.sources) && json.sources.length) {
                formSourceOptions = json.sources;
            }
        } catch (e) {
            console.warn('加载数据来源选项失败，使用默认配置', e);
        }
    }

    function buildSourceSelectHtml(nameAttr) {
        const optionsHtml = formSourceOptions.map(s =>
            `<option value="${s.code}">${s.label}</option>`
        ).join('');
        return `<select name="${nameAttr}" class="w-full bg-white border border-slate-300 rounded-lg px-1 py-1 text-sm">
            <option value="">选择来源</option>
            ${optionsHtml}
        </select>`;
    }

    // 全局变量
    let provinceCityMap = {};
    const areaCache = {};
    const globalSelectedCities = new Set();
    const globalSelectedCityOrder = [];
    const globalSelectedAreas = new Set();
    window.globalSelectedIndicators = window.globalSelectedIndicators || [];
    
    const indicatorCategories = {
        'population': ['#常住人口数', '#户籍人口数'],
        'economic_growth': ['#GDP', '#人均GDP', '#GDP增长率', '#一般公共预算收入', '一般公共预算收入增长率', '人均一般公共预算收入', '#城镇居民人均可支配收入', '农民居民人均纯收入'],
    };

    function renderCitiesForProvince(prov) {
        const container = document.getElementById('city-items');
        const empty = document.getElementById('city-empty');
        if (!container) return;
        container.innerHTML = '';
        const cities = prov && prov !== '' ? (provinceCityMap[prov] || []) : Object.values(provinceCityMap).flat();
        if (!cities || cities.length === 0) { 
            if (empty) empty.classList.remove('hidden'); 
            return; 
        }
        if (empty) empty.classList.add('hidden');
        cities.forEach(city => {
            const id = 'city-' + city.replace(/\s|市/g, '');
            const div = document.createElement('div'); 
            div.className = 'flex items-center mb-1';
            const input = document.createElement('input'); 
            input.type = 'checkbox'; 
            input.className = 'rounded border-slate-300 text-blue-500 city-checkbox'; 
            input.value = city; 
            input.id = id; 
            input.checked = globalSelectedCities.has(city);
            const label = document.createElement('label'); 
            label.htmlFor = id; 
            label.className = 'ml-2 text-slate-700 text-sm cursor-pointer'; 
            label.textContent = city;
            div.appendChild(input); 
            div.appendChild(label); 
            container.appendChild(div);
        });
    }

    function getSelectedCities() { 
        const ordered = globalSelectedCityOrder.filter(city => globalSelectedCities.has(city)); 
        const extras = Array.from(globalSelectedCities).filter(city => !globalSelectedCityOrder.includes(city)); 
        return ordered.concat(extras); 
    }
    
    function getSelectedAreas() { 
        return Array.from(globalSelectedAreas).map(key => { 
            const parts = String(key).split('||'); 
            const city = parts[0] || ''; 
            const area = parts.slice(1).join('||'); 
            return { key: key, city: city, area: area }; 
        }).filter(item => item.city || item.area); 
    }
    
    function makeAreaKey(city, area) { return String(city || '') + '||' + String(area || ''); }

    function loadAreasForCities(cities) {
        if (!cities || cities.length === 0) return Promise.resolve([]);
        const tasks = cities.map(city => {
            if (areaCache[city]) return Promise.resolve(areaCache[city]);
            const url = '/dashboard/get-area-map/?city=' + encodeURIComponent(city);
            return fetch(url, { method: 'GET', credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => { areaCache[city] = Array.isArray(data) ? data : []; return areaCache[city]; })
                .catch(() => { areaCache[city] = []; return []; });
        });
        return Promise.all(tasks).then(results => { 
            const entries = []; 
            results.forEach((list, idx) => { 
                const city = cities[idx]; 
                (list || []).forEach(area => { entries.push({ city: city, area: area }); }); 
            }); 
            return entries; 
        });
    }

    function renderAreasForCities(cities) {
        const container = document.getElementById('area-items'); 
        const empty = document.getElementById('area-empty'); 
        if (!container || !empty) return;
        container.innerHTML = '';
        if (!cities || cities.length === 0) { 
            empty.classList.remove('hidden'); 
            return; 
        }
        loadAreasForCities(cities).then(areas => {
            container.innerHTML = '';
            if (!areas || areas.length === 0) { 
                empty.classList.remove('hidden'); 
                return; 
            }
            empty.classList.add('hidden');
            const areaKeySet = new Set(areas.map(item => makeAreaKey(item.city, item.area)));
            Array.from(globalSelectedAreas).forEach(key => { if (!areaKeySet.has(key)) globalSelectedAreas.delete(key); });
            areas.forEach(item => {
                const key = makeAreaKey(item.city, item.area);
                const labelText = String(item.city || '') + '-' + String(item.area || '');
                const id = 'area-' + labelText.replace(/\s|区|县|市/g, '');
                const div = document.createElement('div'); 
                div.className = 'flex items-center mb-1';
                const input = document.createElement('input'); 
                input.type = 'checkbox'; 
                input.className = 'rounded border-slate-300 text-blue-500 area-checkbox'; 
                input.value = key; 
                input.id = id; 
                input.checked = globalSelectedAreas.has(key);
                const label = document.createElement('label'); 
                label.htmlFor = id; 
                label.className = 'ml-2 text-slate-700 text-sm cursor-pointer'; 
                label.textContent = labelText;
                div.appendChild(input); 
                div.appendChild(label); 
                container.appendChild(div);
            });
        });
    }

    function buildTableHeaders(indicators) {
        const thead = document.querySelector('#manual-section .data-table thead');
        if (!thead) return;
        const firstRow = thead.querySelector('tr:first-child'); 
        const secondRow = thead.querySelector('tr:nth-child(2)');
        firstRow.innerHTML = '<th class="border border-blue-200 px-4 py-3 text-left text-blue-700 font-semibold min-w-24 bg-white">区县</th>';
        indicators.forEach(ind => { 
            const th = document.createElement('th'); 
            th.className = 'border border-blue-200 px-4 py-3 text-left text-blue-700 font-medium'; 
            th.colSpan = 4; 
            th.setAttribute('data-indicator', ind); 
            th.textContent = ind; 
            firstRow.appendChild(th); 
        });
        secondRow.innerHTML = '<th class="border border-blue-200 px-2 py-2 text-left text-slate-500 font-medium text-xs min-w-20 bg-gray-50"></th>';
        indicators.forEach(() => { 
            ['数值', '备注', '数据来源', '去年参考'].forEach(title => { 
                const th = document.createElement('th'); 
                th.className = 'border border-blue-200 px-2 py-2 text-left text-slate-700 font-medium text-xs'; 
                th.textContent = title; 
                secondRow.appendChild(th); 
            }); 
        });
    }

    function renderTableRows() {
        const tbody = document.querySelector('#manual-section .data-table tbody'); 
        if (!tbody) return;
        tbody.innerHTML = '';
        
        const areas = getSelectedAreas();
        const headers = document.querySelectorAll('#manual-section .data-table thead th[data-indicator]'); 
        const groups = headers.length;
        
        if (!areas.length) { 
            const tr = tbody.insertRow(); 
            tr.innerHTML = `<td colspan="${1 + (groups * 4 || 2)}" class="text-center text-slate-400 p-6">请在上方选择区县</td>`; 
            updateProgress(); 
            return; 
        }
        if (!groups) { 
            const tr = tbody.insertRow(); 
            tr.innerHTML = `<td colspan="2" class="text-left text-slate-400 p-6">请先在指标筛选中勾选具体指标</td>`; 
            updateProgress(); 
            return; 
        }
        
        areas.forEach(item => {
            const tr = tbody.insertRow(); 
            tr.className = 'border-b border-blue-100 hover:bg-blue-50/30 transition';
            const tdArea = tr.insertCell(); 
            tdArea.className = 'border border-blue-200 px-4 py-3 text-slate-800 font-medium bg-blue-50/20'; 
            tdArea.textContent = String(item.city || '') + '-' + String(item.area || '');
            tr.dataset.city = item.city || ''; 
            tr.dataset.area = item.area || '';
            
            for (let g = 0; g < groups; g++) {
                const indicatorName = headers[g].getAttribute('data-indicator');
                const sanitize = (s) => ('' + s).replace(/\s+/g, '_').replace(/[^\w\-]/g, '').toLowerCase();
                const areaKey = sanitize((item.city || '') + '_' + (item.area || ''));
                const indKey = sanitize(indicatorName);
                
                const valCell = tr.insertCell(); 
                valCell.className = 'border border-blue-200 px-2 py-2';
                valCell.innerHTML = `<input placeholder="数值" type="text" name="data[${areaKey}][${indKey}][value]" class="w-full bg-white border border-slate-300 rounded-lg px-2 py-1 text-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-200">`;
                
                const noteCell = tr.insertCell(); 
                noteCell.innerHTML = `<input placeholder="备注" type="text" name="data[${areaKey}][${indKey}][note]" class="w-full bg-white border border-slate-300 rounded-lg px-2 py-1 text-sm">`;
                
                const srcCell = tr.insertCell(); 
                srcCell.innerHTML = buildSourceSelectHtml(`data[${areaKey}][${indKey}][source]`);
                
                const refCell = tr.insertCell(); 
                refCell.className = 'border border-blue-200 px-2 py-2 text-slate-400 text-xs'; 
                refCell.innerText = '-';
            }
        });
        attachProgressListeners(); 
        updateProgress();
    }

    window.buildTableHeaders = buildTableHeaders; 
    window.renderTableRows = renderTableRows;

    function loadProvinceCityMap() { 
        return fetch('/dashboard/get-city-map/')
            .then(res=>res.json())
            .then(data=>{ provinceCityMap=data||{}; })
            .catch(()=>{ provinceCityMap={
                "北京市": ["北京市"], "天津市": ["天津市"], "上海市": ["上海市"], "重庆市": ["重庆市"],
                "江苏省": ["南京市", "苏州市", "无锡市", "常州市"],
                "浙江省": ["杭州市", "宁波市", "温州市"],
                "广东省": ["广州市", "深圳市", "珠海市", "佛山市"]
            }; });
    }

    function populateSubfilter(categoryKey) {
        const sub = document.getElementById('indicator-subfilter'); 
        if (!sub) return; 
        sub.innerHTML = '';
        const items = indicatorCategories[categoryKey] || [];
        const ctrlDiv = document.createElement('div'); 
        ctrlDiv.className = 'flex justify-end mb-2 space-x-3';
        const btnAll = document.createElement('button'); 
        btnAll.type = 'button'; 
        btnAll.textContent = '全选'; 
        btnAll.className = 'text-xs text-blue-600 hover:text-blue-800 font-medium';
        const btnNone = document.createElement('button'); 
        btnNone.type = 'button'; 
        btnNone.textContent = '取消全选'; 
        btnNone.className = 'text-xs text-slate-500 hover:text-slate-700';
        ctrlDiv.appendChild(btnAll); 
        ctrlDiv.appendChild(btnNone); 
        sub.appendChild(ctrlDiv);
        
        const listDiv = document.createElement('div'); 
        listDiv.className = 'flex flex-col space-y-2';
        items.forEach((i, idx) => {
            const label = ('' + i).replace(/^#/, ''); 
            const id = 'indicator-' + categoryKey + '-' + idx;
            const row = document.createElement('div'); 
            row.className = 'flex items-center w-full';
            const input = document.createElement('input'); 
            input.type = 'checkbox'; 
            input.className = 'indicator-checkbox rounded border-slate-300 text-blue-500'; 
            input.value = label; 
            input.id = id;
            const lab = document.createElement('label'); 
            lab.htmlFor = id; 
            lab.className = 'ml-2 text-slate-700 text-sm truncate cursor-pointer'; 
            lab.textContent = label;
            row.appendChild(input); 
            row.appendChild(lab); 
            listDiv.appendChild(row);
        });
        sub.appendChild(listDiv);
        
        btnAll.onclick = () => { 
            sub.querySelectorAll('.indicator-checkbox').forEach(cb => { 
                cb.checked = true; 
                if (!window.globalSelectedIndicators.includes(cb.value)) window.globalSelectedIndicators.push(cb.value); 
            }); 
            buildTableHeaders(window.globalSelectedIndicators); 
            renderTableRows(); 
        };
        btnNone.onclick = () => { 
            const vals = Array.from(sub.querySelectorAll('.indicator-checkbox')).map(cb => cb.value); 
            sub.querySelectorAll('.indicator-checkbox').forEach(cb => cb.checked = false); 
            window.globalSelectedIndicators = window.globalSelectedIndicators.filter(v => !vals.includes(v)); 
            buildTableHeaders(window.globalSelectedIndicators); 
            renderTableRows(); 
        };
    }

    function showAutoCloseMessage(message, type) { 
        alert(message); 
    }

    document.addEventListener('DOMContentLoaded', async function() {
        await Promise.all([loadProvinceCityMap(), loadFormSourceOptions()]);
        renderCitiesForProvince('');
        
        const provSel = document.getElementById('province-select');
        if (provSel) provSel.addEventListener('change', () => { 
            renderCitiesForProvince(provSel.value); 
            renderAreasForCities(getSelectedCities()); 
            renderTableRows(); 
        });
        
        document.addEventListener('change', (e) => {
            if (e.target.classList?.contains('city-checkbox')) {
                if (e.target.checked) { 
                    globalSelectedCities.add(e.target.value); 
                    const idx = globalSelectedCityOrder.indexOf(e.target.value); 
                    if (idx > -1) globalSelectedCityOrder.splice(idx,1); 
                    globalSelectedCityOrder.unshift(e.target.value); 
                } else { 
                    globalSelectedCities.delete(e.target.value); 
                    const idx = globalSelectedCityOrder.indexOf(e.target.value); 
                    if (idx > -1) globalSelectedCityOrder.splice(idx,1); 
                }
                renderAreasForCities(getSelectedCities()); 
                renderTableRows();
            }
            if (e.target.classList?.contains('area-checkbox')) {
                if (e.target.checked) globalSelectedAreas.add(e.target.value); 
                else globalSelectedAreas.delete(e.target.value);
                renderTableRows();
            }
            if (e.target.classList?.contains('indicator-checkbox')) {
                if (e.target.checked) { 
                    if (!window.globalSelectedIndicators.includes(e.target.value)) window.globalSelectedIndicators.push(e.target.value); 
                } else window.globalSelectedIndicators = window.globalSelectedIndicators.filter(v => v !== e.target.value);
                buildTableHeaders(window.globalSelectedIndicators); 
                renderTableRows();
            }
        });
        
        document.getElementById('select-all-cities')?.addEventListener('click', () => { 
            const ordered = Array.from(document.querySelectorAll('#city-items .city-checkbox')).map(cb => cb.value); 
            document.querySelectorAll('#city-items .city-checkbox').forEach(cb => cb.checked = true); 
            document.querySelectorAll('#city-items .city-checkbox').forEach(cb => globalSelectedCities.add(cb.value)); 
            globalSelectedCityOrder.length = 0; 
            globalSelectedCityOrder.push(...ordered); 
            renderAreasForCities(getSelectedCities()); 
            renderTableRows(); 
        });
        document.getElementById('deselect-all-cities')?.addEventListener('click', () => { 
            document.querySelectorAll('#city-items .city-checkbox').forEach(cb => cb.checked = false); 
            globalSelectedCities.clear(); 
            globalSelectedCityOrder.length = 0; 
            renderAreasForCities(getSelectedCities()); 
            renderTableRows(); 
        });
        document.getElementById('select-all-areas')?.addEventListener('click', () => { 
            document.querySelectorAll('#area-items .area-checkbox').forEach(cb => { cb.checked = true; globalSelectedAreas.add(cb.value); }); 
            renderTableRows(); 
        });
        document.getElementById('deselect-all-areas')?.addEventListener('click', () => { 
            document.querySelectorAll('#area-items .area-checkbox').forEach(cb => { cb.checked = false; globalSelectedAreas.clear(); }); 
            renderTableRows(); 
        });
        document.getElementById('reset-button')?.addEventListener('click', () => { 
            document.querySelectorAll('#city-items .city-checkbox').forEach(cb => cb.checked = false); 
            document.querySelectorAll('#area-items .area-checkbox').forEach(cb => cb.checked = false); 
            globalSelectedCities.clear(); 
            globalSelectedCityOrder.length = 0; 
            globalSelectedAreas.clear(); 
            renderTableRows(); 
        });

        // 表单提交
        const manualForm = document.getElementById('manual-form');
        if (manualForm) {
            manualForm.addEventListener('submit', function(e) { 
                e.preventDefault(); 
                
                const rows = (()=>{ 
                    const out=[]; 
                    const tbody=document.querySelector('#manual-section .data-table tbody'); 
                    if(!tbody) return out; 
                    const yearSel=document.querySelector('#year-select'); 
                    let year=''; 
                    if(yearSel){ 
                        const ytxt=yearSel.value||yearSel.options[yearSel.selectedIndex]?.text||''; 
                        year=ytxt.replace(/[^\d]/g,''); 
                    } 
                    const province=provSel?provSel.value:''; 
                    const headerEls=document.querySelectorAll('#manual-section .data-table thead th[data-indicator]'); 
                    const indicatorNames=Array.from(headerEls).map(h=>h.getAttribute('data-indicator')); 
                    tbody.querySelectorAll('tr').forEach(tr=>{ 
                        const area=tr.dataset.area||''; 
                        const city=tr.dataset.city||''; 
                        if(!area) return; 
                        let cursor=1; 
                        const groups=[]; 
                        for(let g=0;g<indicatorNames.length;g++){ 
                            const valTd=tr.children[cursor]; 
                            const noteTd=tr.children[cursor+1]; 
                            const sourceTd=tr.children[cursor+2]; 
                            const val=valTd?(valTd.querySelector('input')?valTd.querySelector('input').value.trim():''):''; 
                            const note=noteTd?(noteTd.querySelector('input')?noteTd.querySelector('input').value.trim():''):''; 
                            const source=sourceTd?(sourceTd.querySelector('select')?sourceTd.querySelector('select').value:''):''; 
                            const name_zh=indicatorNames[g]||''; 
                            groups.push({value:val,note:note,source:source,reference:'',name_zh:name_zh}); 
                            cursor+=4; 
                        } 
                        out.push({city:city,area:area,province:province,year:year,groups:groups}); 
                    }); 
                    return out; 
                })();
                
                if(!rows.length){ alert('请先选择一个或多个区县，再提交数据。'); return false; }
                document.getElementById('rows-json').value=JSON.stringify(rows);
                
                const submitBtn=document.getElementById('submit-button'); 
                const originalText=submitBtn.textContent; 
                submitBtn.textContent='提交中...'; 
                submitBtn.disabled=true;
                
                fetch(manualForm.action,{method:'POST',body:new FormData(manualForm)})
                    .then(res=>res.json())
                    .then(data=>{ 
                        if(data.success){ 
                            showAutoCloseMessage('✅ 提交成功！','success'); 
                            setTimeout(()=>window.location.reload(),500); 
                        } else { 
                            alert('❌ 提交失败：'+data.message); 
                            submitBtn.textContent=originalText; 
                            submitBtn.disabled=false; 
                        } 
                    })
                    .catch(()=>{ 
                        alert('❌ 网络错误'); 
                        submitBtn.textContent=originalText; 
                        submitBtn.disabled=false; 
                    });
            });
        }

        const indicatorFilter = document.getElementById('indicator-filter');
        indicatorFilter.addEventListener('change', () => { 
            populateSubfilter(indicatorFilter.value); 
            const sub=document.getElementById('indicator-subfilter'); 
            if(sub) sub.querySelectorAll('.indicator-checkbox').forEach(cb=>cb.checked=window.globalSelectedIndicators.includes(cb.value)); 
            buildTableHeaders(window.globalSelectedIndicators); 
            renderTableRows(); 
        });
        
        populateSubfilter('population'); 
        buildTableHeaders([]); 
        renderTableRows();

        // 选项卡切换
        document.getElementById('manual-tab').onclick=()=>{ 
            document.getElementById('manual-section').classList.remove('hidden'); 
            document.getElementById('excel-section').classList.add('hidden'); 
            attachProgressListeners(); 
            updateProgress(); 
        };
        document.getElementById('excel-tab').onclick=()=>{ 
            document.getElementById('excel-section').classList.remove('hidden'); 
            document.getElementById('manual-section').classList.add('hidden'); 
        };
        
        // Excel年份同步
        const yearSel=document.getElementById('year-select'), excelYear=document.getElementById('excel-upload-year');
        if(yearSel&&excelYear){ 
            const sync=()=>{ excelYear.value=yearSel.value.replace(/[^\d]/g,''); }; 
            sync(); 
            yearSel.addEventListener('change',sync); 
        }
        
        const excelForm=document.getElementById('excel-upload-form');
        if(excelForm) excelForm.addEventListener('submit',function(e){ 
            e.preventDefault(); 
            const fd=new FormData(excelForm); 
            const btn=excelForm.querySelector('button[type="submit"]'); 
            const orig=btn?.textContent; 
            if(btn){ btn.textContent='上传中...'; btn.disabled=true; } 
            fetch(excelForm.action,{method:'POST',body:fd})
                .then(res=>res.json())
                .then(data=>{ 
                    showAutoCloseMessage(data.success?'✅ Excel上传成功！':'❌ 上传失败：'+ (data.message||'未知错误'), data.success?'success':'error'); 
                    if(btn){ btn.textContent=orig; btn.disabled=false; } 
                })
                .catch(()=>{ 
                    showAutoCloseMessage('❌ 网络错误','error'); 
                    if(btn){ btn.textContent=orig; btn.disabled=false; } 
                }); 
        });
    });
</script>
</body>
</html>
